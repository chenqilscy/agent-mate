[package]
name = "agentmate"
version = "0.1.0"
description = "AgentMate — your intelligent work companion (desktop shell)"
authors = ["AgentMate"]
edition = "2021"
rust-version = "1.77"

# The Tauri app logic lives in the library so both the desktop binary (main.rs)
# and any future mobile entry point share one `run()`.
[lib]
name = "agentmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: auto-update (checks a signed release endpoint) + process (relaunch
# after applying an update).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Enabled by tauri-cli in dev; kept for parity with the standard template.
custom-protocol = ["tauri/custom-protocol"]
