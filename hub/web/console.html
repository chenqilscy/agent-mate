<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkBuddy Manager · WorkBuddy App 管理端</title>
<style>
  :root { --bg:#0f1420; --panel:#161c2b; --panel2:#1d2436; --line:#2a3348; --ink:#e7ecf5; --dim:#93a0b8; --brand:#16b37a; --brand2:#2e7df6; --danger:#ef4444; --chip:#232c40; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--brand2); }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 14px; background:var(--brand); color:#fff; font-weight:600; }
  button.ghost { background:var(--chip); color:var(--ink); }
  button.line { background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  button.danger { background:transparent; border:1px solid var(--danger); color:var(--danger); font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea, select { font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--ink); }
  textarea { resize:vertical; min-height:60px; }
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:grid; place-items:center; color:#fff; font-weight:800; }
  .grow { flex:1; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--dim); }
  .badge.admin { background:rgba(46,125,246,.18); color:#7fb0ff; }
  .wrap { display:flex; max-width:1180px; margin:0 auto; }
  .nav { width:180px; padding:16px 10px; border-right:1px solid var(--line); min-height:calc(100vh - 51px); }
  .nav button { display:block; width:100%; text-align:left; background:transparent; color:var(--dim); font-weight:500; margin-bottom:2px; }
  .nav button.active { background:var(--panel2); color:var(--ink); }
  .main { flex:1; padding:22px 26px; min-width:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:15px; }
  .row { display:flex; gap:10px; align-items:center; }
  .list-item { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:var(--panel2); }
  .list-item .t { font-weight:600; }
  .list-item .d { color:var(--dim); font-size:12.5px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .muted { color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:#4b5568; display:inline-block; }
  .dot.on { background:var(--brand); box-shadow:0 0 0 3px rgba(22,179,122,.2); }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--dim); }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
  .cmt { padding:9px 12px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); margin-bottom:7px; }
  .cmt .who { font-weight:600; font-size:12.5px; } .cmt .when { color:var(--dim); font-size:11px; }
  .err { color:var(--danger); font-size:12.5px; min-height:16px; }
  .hidden { display:none; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--dim); margin-bottom:16px; }
  .auth { max-width:380px; margin:8vh auto; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; } .tabs button { background:var(--chip); color:var(--dim); font-weight:500; }
  .tabs button.active { background:var(--brand); color:#fff; }
  code { background:var(--chip); padding:2px 6px; border-radius:5px; }
  /* 连接器浏览橱窗（WB-101）：对齐主应用 App 的 .conn 卡片布局，套 console 暗色 token。cg- 前缀防撞并发改动 */
  .cg-bar { margin-bottom:14px; }
  .cg-search { max-width:280px; }
  .cg-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
  .cg-card { display:flex; gap:12px; align-items:flex-start; padding:15px 16px; border:1px solid var(--line); border-radius:13px; background:var(--panel); cursor:pointer; transition:.15s; }
  .cg-card:hover { border-color:var(--brand); box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .cg-card:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .cg-ic { width:34px; height:34px; border-radius:9px; background:var(--chip); display:grid; place-items:center; font-size:17px; flex-shrink:0; }
  .cg-ic-lg { width:50px; height:50px; border-radius:12px; font-size:26px; }
  .cg-name { font-size:13.5px; font-weight:700; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .cg-desc { font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:4px; }
  .cg-badge { font-size:10px; font-weight:600; padding:1px 7px; border-radius:20px; }
  .cg-badge.rdy { background:rgba(22,179,122,.16); color:#37d39b; }
  .cg-badge.tok { background:rgba(231,163,62,.16); color:#e7a33e; }
  .cg-badge.off { background:var(--chip); color:var(--dim); }
  .cg-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:50; padding:20px; }
  .cg-modal { width:480px; max-width:100%; max-height:88vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  .cg-mh { display:flex; gap:12px; align-items:flex-start; padding:18px 18px 12px; border-bottom:1px solid var(--line); }
  .cg-mname { font-size:18px; font-weight:800; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .cg-mtags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cg-x { background:transparent; color:var(--dim); font-size:22px; font-weight:400; padding:0 6px; }
  .cg-mb { padding:14px 18px; }
  .cg-sec { font-size:12px; color:var(--dim); font-weight:600; margin:14px 0 6px; }
  .cg-sec:first-child { margin-top:0; }
  .cg-mdesc { font-size:13px; line-height:1.7; color:var(--ink); }
  .cg-mf { display:flex; gap:8px; align-items:center; padding:12px 18px; border-top:1px solid var(--line); }
  /* ---- 专家 · 专家团 浏览橱窗（WB-100，App 同款布局，适配控制台 dark token）---- */
  .sec-title { font-size:14px; font-weight:700; margin:22px 0 12px; }
  .scene-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .scene-card { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel); cursor:pointer; transition:.15s; }
  .scene-card:hover { border-color:var(--brand); }
  .sc-top { height:58px; background:linear-gradient(135deg,rgba(22,179,122,.22),rgba(46,125,246,.22)); display:flex; align-items:flex-end; padding:10px 12px; font-size:14px; font-weight:800; }
  .sc-list { padding:8px 6px 10px; }
  .sc-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; font-size:12.5px; color:var(--dim); }
  .sc-item:hover { background:var(--chip); color:var(--ink); }
  .sc-item .av { width:20px; height:20px; border-radius:6px; background:var(--chip); display:grid; place-items:center; font-size:11px; flex-shrink:0; }
  .subtabs { display:flex; align-items:center; gap:16px; margin:20px 0 4px; border-bottom:1px solid var(--line); }
  .subtab { padding:8px 2px; font-size:13.5px; font-weight:600; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subtab:hover { color:var(--ink); }
  .subtab.active { color:var(--ink); border-bottom-color:var(--brand); }
  .cats { display:flex; gap:7px; flex-wrap:wrap; margin:16px 0; }
  .cat { padding:5px 12px; border-radius:20px; font-size:12px; color:var(--dim); cursor:pointer; background:var(--chip); }
  .cat:hover { color:var(--ink); }
  .cat.active { background:var(--brand); color:#fff; }
  .card-grid { display:grid; gap:14px; }
  .card-grid.g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .card-grid.g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (max-width:1080px){ .card-grid.g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .ecard { border:1px solid var(--line); border-radius:13px; padding:15px; background:var(--panel); transition:.15s; cursor:pointer; }
  .ecard:hover { border-color:var(--brand); }
  .ecard.off { opacity:.55; }
  .ec-h { display:flex; gap:11px; align-items:flex-start; }
  .ec-av { width:38px; height:38px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:18px; flex-shrink:0; }
  .ec-n { font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ec-n .b { font-size:9.5px; font-weight:700; color:var(--brand); background:rgba(22,179,122,.16); padding:1px 6px; border-radius:6px; }
  .ec-s { font-size:11px; color:var(--dim); margin-top:2px; }
  .ec-d { font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:10px; min-height:34px; }
  .ec-tags { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .ec-tag { font-size:10.5px; color:var(--ink); background:var(--chip); padding:2px 8px; border-radius:6px; }
  .hub-blank { padding:48px 0; text-align:center; color:var(--dim); font-size:13.5px; }
  /* 详情 / 编辑弹窗（复用 App .np-* 骨架，适配 dark token）*/
  .np-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:150; padding:20px; }
  .np-overlay.open { display:flex; }
  .np-modal { width:520px; max-width:100%; max-height:92vh; background:var(--panel); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
  .np-h { display:flex; align-items:center; gap:12px; padding:18px 22px 8px; font-size:16px; font-weight:800; flex-shrink:0; }
  .np-x { margin-left:auto; width:28px; height:28px; border-radius:8px; background:transparent; color:var(--dim); font-size:19px; line-height:1; display:grid; place-items:center; padding:0; }
  .np-x:hover { background:var(--chip); }
  .np-body { padding:6px 22px 12px; overflow-y:auto; }
  .np-foot { display:flex; align-items:center; gap:10px; padding:14px 22px 18px; border-top:1px solid var(--line); flex-shrink:0; }
  .pkc-row { display:flex; gap:11px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:var(--panel2); }
  .pkc-row .pi { width:26px; height:26px; border-radius:7px; background:var(--chip); display:grid; place-items:center; font-size:14px; flex-shrink:0; }
  .pkc-row .pn { font-size:13.5px; font-weight:700; }
  .pkc-row .pd { font-size:11.8px; color:var(--dim); margin-top:3px; }
  /* 技能浏览橱窗（WB-102）：对齐主应用 App 的技能页（精选/推荐·SkillHub·套件/富卡★⬇/详情），套 console 暗色 token。sg- 前缀防撞并发改动 */
  .sg-sectitle { font-size:14px; font-weight:700; margin:22px 0 12px; }
  .sg-grid { display:grid; gap:14px; }
  .sg-g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .sg-g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (max-width:1080px){ .sg-g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .sg-blank { padding:44px 0; text-align:center; color:var(--dim); font-size:13.5px; }
  .sg-click { cursor:pointer; }
  .sg-flexright { display:flex; align-items:center; justify-content:space-between; }
  .sg-rt { font-size:12px; color:var(--dim); cursor:pointer; -webkit-user-select:none; user-select:none; }
  .sg-rt:hover { color:var(--brand); }
  .sg-seg { display:flex; gap:20px; align-items:baseline; margin:22px 0 2px; }
  .sg-seg-item { font-size:15px; font-weight:700; color:var(--dim); cursor:pointer; }
  .sg-seg-item.active { color:var(--ink); }
  .sg-cathead { display:flex; align-items:flex-start; gap:12px; margin:14px 0 6px; }
  .sg-cats { flex:1; display:flex; gap:7px; flex-wrap:wrap; }
  .sg-cat { padding:5px 12px; border-radius:20px; font-size:12px; color:var(--dim); cursor:pointer; background:var(--chip); }
  .sg-cat:hover { color:var(--ink); }
  .sg-cat.active { background:var(--brand); color:#fff; }
  .sg-cathead-r { flex-shrink:0; margin-top:4px; }
  .sg-link { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--dim); text-decoration:none; white-space:nowrap; }
  .sg-link:hover { color:var(--brand); }
  .sg-fcard { position:relative; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:14px; padding:15px 16px; background:var(--panel); transition:.15s; overflow:hidden; }
  .sg-fcard:hover { border-color:var(--brand); }
  .sg-fbadge { position:absolute; top:0; right:0; font-size:10.5px; font-weight:600; color:var(--brand); background:rgba(22,179,122,.16); padding:3px 10px; border-bottom-left-radius:10px; }
  .sg-fh { display:flex; align-items:center; gap:11px; }
  .sg-fic { width:38px; height:38px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:20px; flex-shrink:0; overflow:hidden; }
  .sg-fn { flex:1; min-width:0; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-fd { font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:10px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sg-hcard { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:13px; padding:14px; background:var(--panel); transition:.15s; }
  .sg-hcard:hover { border-color:var(--brand); }
  .sg-hh { display:flex; align-items:center; gap:10px; }
  .sg-hic { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:14px; font-weight:800; color:#fff; flex-shrink:0; overflow:hidden; }
  .sg-hn { flex:1; min-width:0; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-hd { flex:1; font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:10px; min-height:52px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sg-hfoot { display:flex; align-items:center; gap:14px; margin-top:12px; }
  .sg-hstat { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--dim); }
  .sg-scard { border:1px solid var(--line); border-radius:13px; padding:14px; background:var(--panel); display:flex; gap:12px; transition:.15s; }
  .sg-scard:hover { border-color:var(--brand); }
  .sg-sic { width:38px; height:38px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:19px; flex-shrink:0; }
  .sg-sn { font-size:13px; font-weight:700; }
  .sg-sd { font-size:11.5px; color:var(--dim); line-height:1.5; margin-top:4px; }
  .sg-kit { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:13px; padding:14px; background:var(--panel); }
  .sg-kic { width:42px; height:42px; border-radius:11px; display:grid; place-items:center; font-size:22px; color:#fff; flex-shrink:0; }
  .sg-kn { font-size:13.5px; font-weight:700; }
  .sg-kcount { font-size:11px; font-weight:600; color:var(--dim); }
  .sg-kd { font-size:11.5px; color:var(--dim); line-height:1.5; margin-top:4px; }
  .sg-overlay { position:fixed; inset:0; background:rgba(6,10,18,.62); display:grid; place-items:center; z-index:60; padding:20px; }
  .sg-modal { width:480px; max-width:100%; max-height:88vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  .sg-mh { display:flex; align-items:flex-start; gap:12px; padding:18px 18px 12px; }
  .sg-mic { width:50px; height:50px; border-radius:12px; display:grid; place-items:center; font-size:26px; color:#fff; flex-shrink:0; overflow:hidden; }
  .sg-mtitle { font-size:18px; font-weight:800; }
  .sg-mtags { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:7px; }
  .sg-mx { background:transparent; color:var(--dim); font-size:22px; line-height:1; padding:2px 8px; flex-shrink:0; }
  .sg-mbody { padding:6px 18px 16px; }
  .sg-msec { font-size:12px; color:var(--dim); font-weight:600; margin:14px 0 6px; }
  .sg-mdesc { font-size:13px; line-height:1.7; color:var(--ink); }
  .sg-mfoot { display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--line); }
  .sg-mlink { font-size:12.5px; font-weight:600; color:var(--brand); text-decoration:none; white-space:nowrap; }
  /* ---- 项目管理工作台（WB-111，Linear 风；pd-/pm- 前缀防并发撞车）---- */
  .pd-hero { display:flex; align-items:center; gap:14px; margin:14px 0 2px; }
  .pd-hero-ic { width:46px; height:46px; border-radius:13px; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px; flex-shrink:0; }
  .pm-tabs2 { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:16px 0 18px; }
  .pm-tab { padding:9px 15px; font-size:13.5px; font-weight:600; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; background:transparent; border-radius:0; display:inline-flex; align-items:center; gap:6px; }
  .pm-tab:hover { color:var(--ink); }
  .pm-tab.active { color:var(--ink); border-bottom-color:var(--brand); }
  .pm-tab .tc { font-size:10.5px; font-weight:700; color:var(--dim); background:var(--chip); border-radius:99px; padding:0 7px; }
  .pm-tab.active .tc { color:var(--brand); background:rgba(22,179,122,.16); }
  /* 统计条 */
  .pm-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
  .pm-stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  .pm-stat .n { font-size:25px; font-weight:800; line-height:1.05; }
  .pm-stat .l { font-size:11.5px; color:var(--dim); margin-top:4px; display:flex; align-items:center; gap:5px; }
  .pm-stat .l::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--sc,var(--dim)); flex-shrink:0; }
  .pm-stat.over .n { color:var(--danger); }
  .pm-bar { height:7px; border-radius:99px; background:var(--panel2); overflow:hidden; }
  .pm-bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),#3ddc9a); border-radius:99px; transition:width .3s; }
  /* 工具栏 */
  .pm-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .pm-seg { display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px; }
  .pm-seg > button { padding:5px 13px; font-size:12.5px; font-weight:600; border-radius:7px; background:transparent; color:var(--dim); }
  .pm-seg > button:hover { color:var(--ink); }
  .pm-seg > button.active { background:var(--brand); color:#fff; }
  .pm-fsel { width:auto; padding:6px 9px; font-size:12.5px; background:var(--panel2); }
  .pm-search { width:170px; }
  .pm-spacer { flex:1; }
  /* 里程碑条 */
  .pm-msbar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
  .pm-mschip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:99px; padding:3px 11px; }
  .pm-mschip .mp { font-size:10px; color:var(--dim); }
  .pm-mschip.done { color:var(--brand); border-color:rgba(22,179,122,.4); }
  /* 看板 */
  .pm-board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
  .pm-col { background:var(--panel2); border:1px solid var(--line); border-radius:13px; padding:9px; min-width:0; transition:background .12s,border-color .12s; }
  .pm-col.drop { background:rgba(22,179,122,.08); border-color:var(--brand); }
  .pm-colhead { display:flex; align-items:center; gap:8px; padding:3px 6px 10px; font-size:12.5px; font-weight:700; }
  .pm-colhead .cd { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .pm-colhead .cnt { margin-left:auto; font-size:11px; font-weight:700; color:var(--dim); background:var(--chip); border-radius:99px; padding:1px 9px; }
  .pm-colstack { display:flex; flex-direction:column; gap:8px; min-height:20px; }
  .pm-colempty { text-align:center; color:var(--dim); font-size:11.5px; padding:16px 0; border:1px dashed var(--line); border-radius:10px; }
  /* 卡片 */
  .pm-card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:10px 12px 10px 15px; cursor:pointer; transition:.13s; overflow:hidden; }
  .pm-card:hover { border-color:var(--brand); box-shadow:0 4px 14px rgba(0,0,0,.28); }
  .pm-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pc,transparent); }
  .pm-card .tt { font-size:13px; font-weight:600; line-height:1.42; }
  .pm-cmeta { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; align-items:center; }
  .pm-tag { font-size:10px; color:var(--brand); background:rgba(22,179,122,.14); border-radius:5px; padding:1px 6px; }
  .pm-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--dim); background:var(--chip); border-radius:6px; padding:1px 7px; }
  .pm-chip.over { color:#ff9a9a; background:rgba(239,68,68,.15); }
  .pm-av { width:19px; height:19px; border-radius:50%; color:#fff; font-size:10px; font-weight:700; display:inline-grid; place-items:center; flex-shrink:0; }
  .pm-prio { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; }
  .pm-prio .pd2 { width:8px; height:8px; border-radius:2px; }
  /* 列表 */
  .pm-tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  .pm-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .pm-table th { text-align:left; padding:9px 12px; color:var(--dim); font-weight:600; border-bottom:1px solid var(--line); font-size:11.5px; background:var(--panel2); position:sticky; top:0; }
  .pm-table td { padding:10px 12px; border-bottom:1px solid var(--line); }
  .pm-table tbody tr { cursor:pointer; transition:background .1s; }
  .pm-table tbody tr:last-child td { border-bottom:none; }
  .pm-table tbody tr:hover { background:var(--panel2); }
  .pm-spill { display:inline-block; font-size:11px; font-weight:600; padding:2px 10px; border-radius:99px; }
  /* 甘特 */
  .pm-gantt-head { position:relative; height:18px; margin-bottom:8px; }
  .pm-gantt-head span { position:absolute; transform:translateX(-50%); font-size:10px; color:var(--dim); }
  .pm-gantt-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .pm-gantt-name { width:160px; flex-shrink:0; font-size:12.5px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pm-gantt-track { position:relative; flex:1; height:24px; background:var(--panel2); border-radius:6px; overflow:hidden; }
  .pm-gantt-grid { position:absolute; top:0; bottom:0; width:1px; background:var(--line); }
  .pm-gantt-bar { position:absolute; top:4px; bottom:4px; border-radius:5px; cursor:pointer; opacity:.92; min-width:6px; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .pm-gantt-today { position:absolute; top:-4px; bottom:0; width:2px; background:var(--brand2); z-index:3; }
  .pm-gantt-today::after { content:"今天"; position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--brand2); white-space:nowrap; }
  /* 概览 */
  .pm-ovgrid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:14px; align-items:start; }
  @media (max-width:900px){ .pm-ovgrid { grid-template-columns:1fr; } .pm-board { grid-template-columns:repeat(2,1fr); } .pm-stats { grid-template-columns:repeat(2,1fr); } }
  .pm-msprog { margin-bottom:14px; }
  .pm-msprog .h { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
  .pm-msprog .h b { font-weight:600; }
  .pm-msprog .h span { color:var(--dim); font-size:11.5px; }
  .pm-actitem { display:flex; gap:9px; align-items:flex-start; padding:7px 0; font-size:12.5px; border-bottom:1px solid var(--line); }
  .pm-actitem:last-child { border-bottom:none; }
  .pm-actitem .ai { width:24px; height:24px; border-radius:7px; background:var(--chip); display:grid; place-items:center; font-size:12px; flex-shrink:0; }
  /* 看板/视图增强（WB-113）：泳道分组 + WIP 超限 + 批量条 */
  .pm-lane { margin-bottom:16px; }
  .pm-lanehead { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink); margin:0 0 8px; padding-left:2px; }
  .pm-lanehead .lav { flex-shrink:0; }
  .pm-colhead .cnt.over { color:#fff; background:var(--danger); }
  .pm-wipin { width:42px; margin-left:6px; padding:1px 4px; font-size:11px; }
  .pm-batch { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--brand); border-radius:10px; padding:8px 12px; margin-bottom:10px; }
  .pm-batch b { font-size:12.5px; }
  .pm-batch select { width:auto; padding:5px 8px; font-size:12px; }
  .pm-selrow, #pm-selall { cursor:pointer; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = ""; // same-origin
const TK = "hub.console.token";
let ME = null, VIEW = "projects", CUR = null; // CUR = open project

function tok(){ return localStorage.getItem(TK) || ""; }
function setTok(t){ t ? localStorage.setItem(TK,t) : localStorage.removeItem(TK); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ if(!ts) return ""; const s=Math.floor(Date.now()/1000-ts); if(s<60)return s+"秒前"; if(s<3600)return Math.floor(s/60)+"分前"; if(s<86400)return Math.floor(s/3600)+"小时前"; return Math.floor(s/86400)+"天前"; }

async function api(method, path, body){
  const r = await fetch(API+"/api"+path, {
    method,
    headers: Object.assign({}, tok()?{Authorization:"Bearer "+tok()}:{}, body?{"Content-Type":"application/json"}:{}),
    body: body?JSON.stringify(body):undefined,
  });
  let data=null; try{ data = await r.json(); }catch(e){}
  if(!r.ok){ const msg = (data&&data.detail)? (typeof data.detail==="string"?data.detail:JSON.stringify(data.detail)) : ("HTTP "+r.status); throw new Error(msg); }
  return data;
}

// ---------- auth ----------
async function boot(){
  if(tok()){ try{ ME = (await api("GET","/me")).account; }catch(e){ setTok(""); ME=null; } }
  render();
}
async function doAuth(kind, name, password){
  const res = await api("POST", kind==="register"?"/auth/register":"/auth/login", {name, password});
  setTok(res.token); ME = res.account; VIEW="projects"; render();
}
function logout(){ setTok(""); ME=null; render(); }

// ---------- render ----------
function render(){
  const app = document.getElementById("app");
  if(!ME){ app.innerHTML = authView(); wireAuth(); return; }
  app.innerHTML = `
    <div class="topbar">
      <div class="logo">M</div><b>WorkBuddy Manager</b><span class="badge">App 管理端</span>
      <div class="grow"></div>
      <span>${esc(ME.name)}</span>${ME.is_platform_admin?'<span class="badge admin">平台管理员</span>':''}
      <button class="line" id="logout">退出</button>
    </div>
    <div class="wrap">
      <div class="nav">
        ${navBtn("projects","项目")}${ME.is_platform_admin?navBtn("catalog","目录运营中心"):""}${navBtn("orgs","组织")}${navBtn("notifs","通知")}${ME.is_platform_admin?navBtn("settings","设置"):""}
      </div>
      <div class="main" id="main"></div>
    </div>`;
  document.getElementById("logout").onclick = logout;
  document.querySelectorAll(".nav button").forEach(b=> b.onclick=()=>{ VIEW=b.dataset.v; CUR=null; render(); });
  const m = document.getElementById("main");
  if(VIEW==="projects") CUR? projectDetail(m) : projectsView(m);
  else if(VIEW==="orgs") orgsView(m);
  else if(VIEW==="notifs") notifsView(m);
  else if(VIEW==="catalog") catalogView(m);
  else if(VIEW==="settings") settingsView(m);
}
function navBtn(v,label){ return `<button data-v="${v}" class="${VIEW===v?'active':''}">${label}</button>`; }

function authView(){
  return `<div class="auth"><div class="card">
    <h1>WorkBuddy Manager</h1><div class="sub">WorkBuddy App 管理端 · 登录或注册</div>
    <div class="tabs"><button data-k="login" class="active">登录</button><button data-k="register">注册</button></div>
    <div class="field"><label>用户名</label><input id="au-name" autocomplete="username"></div>
    <div class="field"><label>密码（≥4 位）</label><input id="au-pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="au-err"></div>
    <button id="au-go" style="width:100%">登录</button>
    <div class="muted" style="margin-top:10px;font-size:12px">首个注册的账号会成为平台管理员。</div>
  </div></div>`;
}
function wireAuth(){
  let kind="login";
  document.querySelectorAll(".tabs button").forEach(b=> b.onclick=()=>{
    kind=b.dataset.k; document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    document.getElementById("au-go").textContent = kind==="login"?"登录":"注册";
  });
  document.getElementById("au-go").onclick = async ()=>{
    const n=document.getElementById("au-name").value.trim(), p=document.getElementById("au-pw").value;
    document.getElementById("au-err").textContent="";
    try{ await doAuth(kind, n, p); }catch(e){ document.getElementById("au-err").textContent=e.message; }
  };
}

// ---------- projects ----------
async function projectsView(m){
  m.innerHTML = `<h1>项目</h1><div class="sub">你拥有或参与的项目</div>
    <div class="card"><h3>新建项目</h3>
      <div class="field"><label>名称</label><input id="p-name"></div>
      <div class="field"><label>指令（可选）</label><textarea id="p-instr"></textarea></div>
      <div class="err" id="p-err"></div><button id="p-create">创建</button></div>
    <div id="p-list" class="muted">加载中…</div>`;
  document.getElementById("p-create").onclick = async ()=>{
    try{ await api("POST","/projects",{name:document.getElementById("p-name").value.trim(), instruction:document.getElementById("p-instr").value}); projectsView(m); }
    catch(e){ document.getElementById("p-err").textContent=e.message; }
  };
  try{
    const {projects} = await api("GET","/projects");
    document.getElementById("p-list").innerHTML = projects.length? projects.map(p=>`
      <div class="list-item"><div style="flex:1"><div class="t">${esc(p.name)}</div>
        <div class="d">${esc(p.role)}${p.origin&&p.origin!=='local'?' · '+esc(p.origin):''}</div></div>
        <button class="line" data-open="${p.id}">打开</button></div>`).join("") : '<div class="muted">还没有项目</div>';
    m.querySelectorAll("[data-open]").forEach(b=> b.onclick=()=>{ CUR={id:b.dataset.open}; render(); });
  }catch(e){ document.getElementById("p-list").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// 项目详情 = 标签页工作台（WB-111）：概览 / 任务 / 协作 / 配置。项目基本信息 + 只读态一次取好存 PD，
// 各 tab 用其渲染，避免重复取数、并让「任务」独占整页成为专业 PM 工作台。
let PD = null;              // { pid, name, instruction, role, ro }
let PD_TAB = "overview";   // overview | tasks | collab | config
async function projectDetail(m){
  const pid = CUR.id;
  m.innerHTML = `<button class="line" id="back">← 返回项目</button>
    <div id="pd-shell"><div class="muted" style="padding:22px 0">加载中…</div></div>`;
  document.getElementById("back").onclick=()=>{ CUR=null; PD=null; render(); };
  let p; try{ p = await api("GET","/projects/"+pid); }
  catch(e){ document.getElementById("pd-shell").innerHTML=`<div class="err" style="margin-top:14px">${esc(e.message)}</div>`; return; }
  PD = { pid, name:p.name||"项目", instruction:p.instruction||"", role:p.role, ro:p.role==="Viewer" };
  // 任务数徽标：概览/任务 tab 头上带一个总数，需先探一下 work-items（失败则省略）。
  let taskN = null; try{ const wi = await api("GET","/projects/"+pid+"/work-items"); taskN = (wi.items||[]).filter(x=>!x.parent_id).length; }catch(e){}
  document.getElementById("pd-shell").innerHTML = `
    <div class="pd-hero">
      <div class="pd-hero-ic">${esc((PD.name||"P").slice(0,1))}</div>
      <div style="flex:1;min-width:0">
        <h1 id="pd-name" style="margin:0;font-size:21px">${esc(PD.name)}</h1>
        <div class="sub" style="margin:3px 0 0">${PD.instruction?esc(PD.instruction):'<span class="muted">未设置项目指令</span>'} ${PD.ro?'<span class="pill">只读</span>':''}</div>
      </div>
    </div>
    <div class="pm-tabs2" id="pd-tabs">
      ${pdTabBtn("overview","概览")}
      ${pdTabBtn("tasks","任务",taskN)}
      ${pdTabBtn("collab","协作")}
      ${pdTabBtn("config","配置")}
    </div>
    <div id="pd-body"></div>`;
  document.getElementById("pd-tabs").querySelectorAll("[data-tab]").forEach(b=> b.onclick=()=>{ PD_TAB=b.dataset.tab; document.getElementById("pd-tabs").querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===PD_TAB)); pdRenderTab(); });
  pdRenderTab();
}
function pdTabBtn(t,label,cnt){ return `<button class="pm-tab ${PD_TAB===t?'active':''}" data-tab="${t}">${label}${cnt!=null?`<span class="tc">${cnt}</span>`:""}</button>`; }
function pdRenderTab(){
  const body = document.getElementById("pd-body"); if(!body) return;
  const pid = PD.pid;
  if(PD_TAB==="tasks"){ body.innerHTML = `<div id="pd-work"><div class="muted">加载中…</div></div>`; loadWorkItems(pid, PD.ro); }
  else if(PD_TAB==="collab") pdTabCollab(body, pid);
  else if(PD_TAB==="config"){ body.innerHTML = `<div class="card" id="pd-cfg"><h3>配置</h3><div class="muted">加载中…</div></div>`; loadConfig(pid); }
  else pdTabOverview(body, pid);
}
// 概览：健康度统计 + 进度条 + 里程碑进度 + 近期任务活动。
async function pdTabOverview(body, pid){
  body.innerHTML = `<div id="pm-stats-slot"><div class="muted">加载中…</div></div>`;
  let items=[], miles=[], activity=[];
  try{
    const [wi, ms, ac] = await Promise.all([
      api("GET","/projects/"+pid+"/work-items"),
      api("GET","/projects/"+pid+"/milestones"),
      api("GET","/projects/"+pid+"/activity").catch(()=>({activity:[]})),
    ]);
    items=(wi.items||[]).filter(x=>!x.parent_id); miles=ms.milestones||[]; activity=ac.activity||[];
  }catch(e){ body.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const today = pmToday();
  const cnt = s => items.filter(x=>x.status===s).length;
  const total=items.length, done=cnt("done"), doing=cnt("doing"), todo=cnt("todo");
  const overdue = items.filter(x=>x.due_date && x.due_date<today && x.status!=="done").length;
  const pct = total? Math.round(done/total*100):0;
  const msRows = miles.length ? miles.map(m=>{
    const mi=items.filter(x=>x.milestone_id===m.id), md=mi.filter(x=>x.status==="done").length;
    const mp = mi.length? Math.round(md/mi.length*100):0;
    return `<div class="pm-msprog"><div class="h"><b>🚩 ${esc(m.name)}${m.status==="closed"?" ✓":""}</b><span>${md}/${mi.length} · ${mp}%</span></div><div class="pm-bar"><i style="width:${mp}%"></i></div></div>`;
  }).join("") : '<div class="muted" style="font-size:12.5px">还没有里程碑</div>';
  const acts = activity.length ? activity.slice(0,12).map(x=>`<div class="pm-actitem"><div class="ai">${pmActIcon(x.kind)}</div><div style="flex:1;min-width:0"><div><b style="font-weight:600">${esc(x.actor||"?")}</b> ${esc(pmActLabel(x.kind))}${x.detail?` · ${esc(x.detail)}`:""}</div><div class="muted" style="font-size:11px;margin-top:1px">${ago(x.created_at)}</div></div></div>`).join("") : '<div class="muted" style="font-size:12.5px">暂无任务活动</div>';
  body.innerHTML = `
    <div class="pm-stats">
      <div class="pm-stat" style="--sc:var(--dim)"><div class="n">${total}</div><div class="l">任务总数</div></div>
      <div class="pm-stat" style="--sc:#2e7df6"><div class="n">${doing}</div><div class="l">进行中</div></div>
      <div class="pm-stat" style="--sc:var(--brand)"><div class="n">${done}</div><div class="l">已完成</div></div>
      <div class="pm-stat over" style="--sc:var(--danger)"><div class="n">${overdue}</div><div class="l">已逾期</div></div>
    </div>
    <div class="card" style="padding:14px 18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:9px"><span class="muted">整体进度</span><span style="font-weight:800;font-size:15px">${pct}%</span></div>
      <div class="pm-bar" style="height:9px"><i style="width:${pct}%"></i></div>
      <div style="display:flex;gap:16px;margin-top:11px;font-size:11.5px;color:var(--dim)">
        <span>待办 ${todo}</span><span>进行中 ${doing}</span><span>已完成 ${done}</span>${overdue?`<span style="color:var(--danger)">逾期 ${overdue}</span>`:""}
      </div>
    </div>
    <div class="pm-ovgrid">
      <div class="card"><h3>里程碑进度</h3>${msRows}</div>
      <div class="card"><h3>近期活动</h3>${acts}</div>
    </div>`;
}
// 协作：成员 / 邀请码 / 在线状态 / 讨论 / 时间线（原详情页右侧诸卡片，聚到一个 tab）。
function pdTabCollab(body, pid){
  const ro = PD.ro;
  body.innerHTML = `<div class="grid2">
    <div>
      <div class="card"><h3>成员</h3><div id="pd-members" class="muted">…</div>
        ${ro?"":`<div class="row" style="margin-top:10px"><input id="pd-add" placeholder="账号名"><select id="pd-role" style="width:120px"><option>Member</option><option>Admin</option><option>Viewer</option></select><button id="pd-addbtn">加入</button></div>
        <div class="err" id="pd-merr"></div>`}</div>
      ${ro?"":`<div class="card"><h3>邀请码</h3><div class="row"><select id="pd-invrole" style="width:120px"><option>Member</option><option>Admin</option><option>Viewer</option></select><button id="pd-inv">生成邀请码</button></div><div id="pd-invout" style="margin-top:8px"></div></div>`}
      <div class="card"><h3>在线状态</h3><div id="pd-presence" class="muted">…</div></div>
    </div>
    <div>
      <div class="card"><h3>讨论</h3><div id="pd-comments" class="muted">…</div>
        <div class="field" style="margin-top:10px"><textarea id="pd-cbody" placeholder="写评论…可 @用户名 提及成员"></textarea></div>
        <div class="err" id="pd-cerr"></div><button id="pd-csend">发送</button></div>
      <div class="card"><h3>时间线</h3><div id="pd-timeline" class="muted">…</div></div>
    </div>
  </div>`;
  loadMembers(pid); loadPresence(pid); loadComments(pid); loadTimeline(pid);
  if(!ro){
    document.getElementById("pd-addbtn").onclick = async ()=>{
      try{ await api("POST",`/projects/${pid}/members`,{name:document.getElementById("pd-add").value.trim(), role:document.getElementById("pd-role").value}); document.getElementById("pd-add").value=""; loadMembers(pid); }
      catch(e){ document.getElementById("pd-merr").textContent=e.message; }
    };
    document.getElementById("pd-inv").onclick = async ()=>{
      try{ const i = await api("POST",`/projects/${pid}/invites`,{role:document.getElementById("pd-invrole").value}); document.getElementById("pd-invout").innerHTML = `邀请码：<code>${esc(i.code)}</code>`; }
      catch(e){ document.getElementById("pd-invout").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  document.getElementById("pd-csend").onclick = async ()=>{
    const b=document.getElementById("pd-cbody");
    try{ await api("POST",`/projects/${pid}/comments`,{body:b.value.trim()}); b.value=""; document.getElementById("pd-cerr").textContent=""; loadComments(pid); loadTimeline(pid); }
    catch(e){ document.getElementById("pd-cerr").textContent=e.message; }
  };
}
// 项目配置编辑（WB-080）：指令 + 连接器/专家/技能（读目录作建议、写 PATCH /projects）。
// connectors/experts/skills 是名字数组；datalist 从 Hub 目录相应类别取建议，也允许自由输入
// （名字须与本地 backend 内置定义一致才真生效，目录空时靠自由输入兜底）。
const CFG_CATS = { connectors:"NP_CONNS", experts:"EXP_GRID", skills:"SK_GRID" };
const WI_COLS = [["todo","待办"],["doing","进行中"],["paused","暂停"],["done","完成"]];
async function catalogNames(category){
  try{ const {items} = await api("GET","/catalog/"+category);
    return items.map(it=>{ const d=it.data; return Array.isArray(d)?(d[1]||d[0]):((d&&d.name)||""); }).filter(Boolean);
  }catch(e){ return []; }
}
async function loadConfig(pid){
  const box = document.getElementById("pd-cfg");
  let p; try{ p = await api("GET","/projects/"+pid); }catch(e){ box.innerHTML = `<h3>配置</h3><div class="err">${esc(e.message)}</div>`; return; }
  const ro = p.role === "Viewer";
  const cur = { connectors:[...(p.connectors||[])], experts:[...(p.experts||[])], skills:[...(p.skills||[])] };

// 团队计划/任务 —— 专业化（WB-106）：卡片显优先级/负责人/截止/标签/里程碑/子任务数；点卡开详情抽屉

// <style>/目录区，防撞，沿用 cg-/sg- 约定）。复用 WI_COLS（状态列）。Viewer 只读。
const PM_PRIO = { "":["无","#9aa0a6"], low:["低","#16b37a"], medium:["中","#2e7df6"], high:["高","#f0a020"], urgent:["紧急","#ef4444"] };

function pmAvatar(name){ const s=String(name||"?"); let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return `<span class="pm-av" style="background:${PM_AVC[h%PM_AVC.length]}">${esc(s.slice(0,1).toUpperCase())}</span>`; }
function pmActIcon(k){ k=String(k||""); if(k.includes("create"))return "✚"; if(k.includes("delete"))return "🗑"; if(k.includes("status")||k.includes("update"))return "✎"; if(k.includes("comment"))return "💬"; return "•"; }
function pmActLabel(k){ const M={created:"新建了任务","status_changed":"更新了状态",updated:"更新了任务",deleted:"删除了任务",commented:"发表了评论"}; return M[k]||k; }

// 筛选 + 排序（作用于全部视图，WB-107）。
function pmFiltered(){
  const f = PM_FILTER;
  let r = PM_CTX.items.filter(x=>!x.parent_id);
  if(f.q){ const q=f.q.toLowerCase(); r = r.filter(x=>(x.title||"").toLowerCase().includes(q)); }
  if(f.status) r = r.filter(x=>x.status===f.status);
  if(f.priority) r = r.filter(x=>(x.priority||"")===f.priority);
  if(f.assignee) r = r.filter(x=>x.assignee===f.assignee);
  if(f.milestone) r = r.filter(x=>x.milestone_id===f.milestone);
  const P = { urgent:4, high:3, medium:2, low:1, "":0 };
  if(PM_SORT==="priority") r = [...r].sort((a,b)=>(P[b.priority||""]||0)-(P[a.priority||""]||0));
  else if(PM_SORT==="due") r = [...r].sort((a,b)=>(a.due_date||"9999-99-99").localeCompare(b.due_date||"9999-99-99"));
  return r;
}
// 泳道分组（WB-113）：按负责人 / 里程碑 把过滤后的根任务分组，未指派/无里程碑排最后。
function pmGroups(roots, mode){
  const seen = new Map();
  roots.forEach(x=>{ const id = (mode==="assignee"? x.assignee : x.milestone_id) || ""; if(!seen.has(id)) seen.set(id,[]); seen.get(id).push(x); });
  const out = [];
  seen.forEach((items,id)=>{
    let label;
    if(mode==="assignee") label = id ? `${pmAvatar(items[0].assignee_name||id)}<span>${esc(items[0].assignee_name||id)}</span>` : '<span class="muted">未指派</span>';
    else label = id ? `🚩 ${esc(pmMsName(id))}` : '<span class="muted">无里程碑</span>';
    out.push({ id, label, items });
  });
  out.sort((a,b)=>(a.id?0:1)-(b.id?0:1));
  return out;
}
// 套用一个保存的视图（WB-113）：整组筛选/排序/视图/分组一并恢复，再整体重渲染。
function pmApplyView(v){

// 批量操作（WB-113）：对列表选中的任务逐条 PATCH / DELETE，完成后清空选择并刷新。
async function pmBatch(patch){

async function pmBatchDelete(){

// 任务工作台外壳（WB-111）：统计条 + 进度条 + 里程碑条 + 工具栏（分段视图切换/搜索/筛选/排序）+ 快速新建；

function pmBindOpen(box){ box.querySelectorAll("[data-open]").forEach(c=> c.onclick=()=> pmOpenTask(c.dataset.open)); }
function pmViewBoard(roots){
  const box=document.getElementById("pm-view");
  const wip=pmGetWip(), ro=PM_CTX.ro;
  // 单条泳道（或整个看板）的四状态列。WIP：设了上限 → 显示 count/limit，超限计数标红；编辑态显数字输入框。
  const boardFor = (items) => `<div class="pm-board">${WI_COLS.map(([s,label])=>{
      const list=items.filter(x=>x.status===s), lim=wip[s], over=lim&&list.length>lim;
      const cntTxt = lim ? `${list.length}/${lim}` : `${list.length}`;
      const wipIn = (PM_WIPEDIT&&!ro) ? `<input class="pm-wipin" data-wip="${s}" type="number" min="0" value="${lim||""}" placeholder="∞">` : "";
      return `<div class="pm-col" data-colstack="${s}"><div class="pm-colhead"><span class="cd" style="background:${WI_COL_C[s]}"></span>${label}<span class="cnt${over?" over":""}">${cntTxt}</span>${wipIn}</div>`
        + `<div class="pm-colstack">${list.map(pmCardHtml).join("")||'<div class="pm-colempty">拖到此处</div>'}</div></div>`;
    }).join("")}</div>`;
  if(PM_GROUP==="none"){
    box.innerHTML = boardFor(roots);
  } else {
    const groups = pmGroups(roots, PM_GROUP);
    box.innerHTML = groups.length ? groups.map(g=>`<div class="pm-lane"><div class="pm-lanehead">${g.label} <span class="pill">${g.items.length}</span></div>${boardFor(g.items)}</div>`).join("") : '<div class="pm-colempty">无任务</div>';
  }
  pmBindOpen(box);
  // WIP 输入：>0 存上限，空/0 清除（localStorage per project）。
  box.querySelectorAll(".pm-wipin").forEach(inp=> inp.onchange=()=>{ const w=pmGetWip(), v=parseInt(inp.value,10); if(v>0) w[inp.dataset.wip]=v; else delete w[inp.dataset.wip]; pmSetWip(w); pmRenderView(); });
  if(ro) return;
  // 拖卡换列 = 快速改状态（WB-110）。分组时拖只改 status、不动分组维度；每条泳道的列各自是放置区。
  box.querySelectorAll("[data-open]").forEach(c=>{
    c.ondragstart = e=>{ e.dataTransfer.setData("text/plain", c.dataset.open); e.dataTransfer.effectAllowed="move"; };
  });
  box.querySelectorAll("[data-colstack]").forEach(col=>{
    col.ondragover = e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; col.classList.add("drop"); };
    col.ondragleave = ()=>{ col.classList.remove("drop"); };
    col.ondrop = async e=>{
      e.preventDefault(); col.classList.remove("drop");

// 甘特/时间线：按 start_date→due_date 画相对横条（无 start 用 due 当点）+ 今天标记 + 月度网格。
function pmViewGantt(roots){
  const box=document.getElementById("pm-view");
  const dated=roots.filter(x=>x.due_date||x.start_date);
  if(!dated.length){ box.innerHTML='<div class="pm-colempty" style="margin-top:8px">无排期任务 —— 给任务设开始/截止日期即可在此按时间轴排布</div>'; return; }
  const toD=s=>{ const a=String(s).split("-").map(Number); return Date.UTC(a[0],(a[1]||1)-1,a[2]||1)/86400000; };
  let min=Infinity,max=-Infinity;
  dated.forEach(x=>{ const s=toD(x.start_date||x.due_date), e=toD(x.due_date||x.start_date); if(s<min)min=s; if(e>max)max=e; });
  const tD=toD(pmToday()); if(tD<min)min=tD; if(tD>max)max=tD;   // 让今天线永远落在范围内
  if(max<=min) max=min+1;
  const pad=Math.max((max-min)*0.04,1); min-=pad; max+=pad;
  const range=max-min;
  const fmt=n=>{ const d=new Date(n*86400000); return (d.getUTCMonth()+1)+"/"+d.getUTCDate(); };
  const ticks=[0,.2,.4,.6,.8,1].map(f=>`<span style="left:${(f*100).toFixed(1)}%">${fmt(min+f*range)}</span>`).join("");
  const grid=[0,.2,.4,.6,.8,1].map(f=>`<div class="pm-gantt-grid" style="left:${(f*100).toFixed(1)}%"></div>`).join("");
  const todayL=((tD-min)/range*100).toFixed(1);
  const rows=dated.map(x=>{ const s=toD(x.start_date||x.due_date), e=toD(x.due_date||x.start_date); const left=((s-min)/range*100).toFixed(1), w=Math.max((e-s)/range*100,1.2).toFixed(1); const pc=(PM_PRIO[x.priority||""]||PM_PRIO[""])[1];
    return `<div class="pm-gantt-row"><div class="pm-gantt-name" data-open="${x.id}">${esc(x.title)}</div><div class="pm-gantt-track">${grid}<div class="pm-gantt-today" style="left:${todayL}%"></div><div class="pm-gantt-bar" data-open="${x.id}" title="${esc(x.start_date||"")} → ${esc(x.due_date||"")}" style="left:${left}%;width:${w}%;background:${pc}"></div></div></div>`;
  }).join("");
  box.innerHTML = `<div style="display:flex;gap:10px"><div style="width:160px;flex-shrink:0"></div><div class="pm-gantt-head" style="flex:1">${ticks}</div></div>${rows}`;
  pmBindOpen(box);
}

// 连接器 tab 分发（WB-101）：子切换「浏览橱窗 | 目录管理」，两者读同一份 CONN_DEFS。

// 浏览橱窗（WB-101）：对齐主应用 .conn 的双列卡片（icon+名称+rdy/tok 徽章+简介）+ 名称/简介搜索 + 只读详情浮层。
async function connectorsGallery(sub){
  sub.innerHTML = `<div class="cg-bar"><input id="cg-q" class="cg-search" placeholder="搜索连接器"></div><div id="cg-grid" class="muted">加载中…</div>`;
  const grid = document.getElementById("cg-grid");
  let items = [];
  try{ const r = await api("GET","/catalog/CONN_DEFS?all=true"); items = r.items||[]; }
  catch(e){ grid.className=""; grid.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const badge = d => d.status==="rdy"?'<span class="cg-badge rdy">内置即用</span>':(d.status==="tok"?'<span class="cg-badge tok">需连接</span>':'');
  const draw = q => {
    const kw=(q||"").trim().toLowerCase();
    const list = items.filter(it=>{ const d=it.data||{}; return !kw || (d.name||"").toLowerCase().includes(kw) || (d.desc||"").toLowerCase().includes(kw); });
    if(!list.length){ grid.className="muted"; grid.innerHTML = `<div style="padding:18px 0">${items.length?"没有匹配的连接器":"还没有连接器目录项，去「目录管理」新增"}</div>`; return; }
    grid.className="cg-grid";
    grid.innerHTML = list.map(it=>{ const d=it.data||{}; const off=it.enabled?"":'<span class="cg-badge off">停用</span>'; return `<div class="cg-card" role="button" tabindex="0" data-id="${esc(it.id)}"><div class="cg-ic">${esc(d.icon||"🔗")}</div><div style="flex:1;min-width:0"><div class="cg-name">${esc(d.name||"?")}${badge(d)}${off}</div><div class="cg-desc">${esc(d.desc||"")}</div></div></div>`; }).join("");
    grid.querySelectorAll("[data-id]").forEach(c=>{ const open=()=>connectorDetail(items.find(x=>x.id===c.dataset.id)); c.onclick=open; c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } }; });
  };
  draw("");
  document.getElementById("cg-q").oninput = e=> draw(e.target.value);
}

// 只读详情浮层（WB-101）：管理台无会话/loadout/OAuth，不搬 App 的添加会话/去试试/连接授权；
// 提供「编辑此连接器」跳目录管理并载入该项。
function connectorDetail(it){
  if(!it) return;
  const d=it.data||{}, L=d.launch||{};
  const lsum = L.builtin_server ? ("内置 · "+L.builtin_server) : (L.command ? ("stdio · "+(L.command+" "+((L.args||[]).join(" "))).trim()) : "—");
  const badge = d.status==="rdy"?'<span class="cg-badge rdy">内置即用</span>':(d.status==="tok"?'<span class="cg-badge tok">需连接</span>':'');
  const off = it.enabled?"":'<span class="cg-badge off">停用</span>';
  const req = L.requires||[];
  const ov = document.createElement("div"); ov.className="cg-overlay";
  ov.innerHTML = `<div class="cg-modal" role="dialog" aria-modal="true" aria-label="${esc(d.name||"连接器")}">
    <div class="cg-mh"><div class="cg-ic cg-ic-lg">${esc(d.icon||"🔗")}</div>
      <div style="flex:1;min-width:0"><div class="cg-mname">${esc(d.name||"?")}${badge}${off}</div>
        <div class="cg-mtags"><span class="pill">连接器</span></div></div>
      <button class="cg-x" aria-label="关闭">×</button></div>
    <div class="cg-mb">
      <div class="cg-sec">能力介绍</div><div class="cg-mdesc">${esc(d.desc||"（无简介）")}</div>
      <div class="cg-sec">启动方式</div><div class="cg-mdesc"><code>${esc(lsum)}</code></div>
      ${req.length?`<div class="cg-sec">所需凭据（环境变量名）</div><div class="cg-mtags">${req.map(r=>`<span class="pill">${esc(r)}</span>`).join("")}</div>`:""}
    </div>
    <div class="cg-mf"><button class="line cg-edit">编辑此连接器</button><div class="grow"></div><button class="cg-close">关闭</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onmousedown = e=>{ if(e.target===ov) close(); };
  ov.querySelector(".cg-x").onclick = close;
  ov.querySelector(".cg-close").onclick = close;
  ov.querySelector(".cg-edit").onclick = ()=>{ close(); CONN_EDIT_ID=it.id; CONNSUB="manage"; render(); };
}

        <div class="field"><label>builtin_server</label><input id="cn-bsrv" list="cn-bsrv-dl" placeholder="notes / clock / search / telegram / kdocs"><datalist id="cn-bsrv-dl">${BUILTIN_SERVERS.map(s=>`<option value="${s}"></option>`).join("")}</datalist></div>
        <div class="grid2"><div class="field"><label>requires（环境变量名，逗号分隔，可空）</label><input id="cn-breq" placeholder="TELEGRAM_BOT_TOKEN"></div>
          <div class="field"><label>requires_bin（依赖命令，逗号分隔，可空）</label><input id="cn-bbin" placeholder="kdocs-cli"></div></div>
      </div>
      <div id="cn-stdio" style="display:none">
        <div class="field"><label>command</label><input id="cn-cmd" placeholder="npx"></div>
        <div class="field"><label>args（每行一个）</label><textarea id="cn-args" placeholder="-y&#10;@modelcontextprotocol/server-github"></textarea></div>
        <div class="field"><label>secret_env（每行「子进程变量名=来源环境变量名」，仅变量名、绝不填值）</label><textarea id="cn-senv" placeholder="GITHUB_PERSONAL_ACCESS_TOKEN=GITHUB_TOKEN"></textarea></div>
        <div class="field"><label>requires（环境变量名，逗号分隔）</label><input id="cn-sreq" placeholder="GITHUB_TOKEN"></div>
      </div>
      <div class="row"><input id="cn-sort" type="number" value="0" style="width:80px"><span class="muted" style="font-size:12px">排序</span><div class="grow"></div><button class="ghost" id="cn-clear">清空</button><button id="cn-save">保存</button></div>
      <div class="err" id="cn-err"></div></div>
    <div id="cn-list" class="muted">加载中…</div>`;
  const F = id=>document.getElementById(id);
  const csv = s => s.split(",").map(x=>x.trim()).filter(Boolean);
  const lines = s => s.split("\n").map(x=>x.trim()).filter(Boolean);
  const setType = t=>{ F("cn-builtin").style.display = t==="builtin"?"":"none"; F("cn-stdio").style.display = t==="stdio"?"":"none"; };
  F("cn-type").onchange = ()=> setType(F("cn-type").value);
  function fill(it){
    const d = it? it.data : {}, L = (d&&d.launch) || {};
    F("cn-id").value = it? it.id : "";
    F("cn-icon").value=d.icon||""; F("cn-name").value=d.name||""; F("cn-desc").value=d.desc||""; F("cn-status").value=d.status||"rdy";
    const isStdio = !!L.command;
    F("cn-type").value = isStdio?"stdio":"builtin"; setType(F("cn-type").value);
    F("cn-bsrv").value=L.builtin_server||""; F("cn-breq").value=(!isStdio?(L.requires||[]):[]).join(", "); F("cn-bbin").value=(L.requires_bin||[]).join(", ");
    F("cn-cmd").value=L.command||""; F("cn-args").value=(L.args||[]).join("\n"); F("cn-senv").value=Object.entries(L.secret_env||{}).map(([k,v])=>`${k}=${v}`).join("\n"); F("cn-sreq").value=(isStdio?(L.requires||[]):[]).join(", ");
    F("cn-sort").value = it? it.sort : 0; F("cn-h").textContent = it? "编辑连接器":"新增连接器";
  }
  F("cn-clear").onclick=()=>fill(null);
  F("cn-save").onclick = async ()=>{
    F("cn-err").textContent="";
    const name=F("cn-name").value.trim(); if(!name){ F("cn-err").textContent="名称必填"; return; }
    let launch;
    if(F("cn-type").value==="builtin"){
      launch={ builtin_server:F("cn-bsrv").value.trim(), builtin:true };
      if(!launch.builtin_server){ F("cn-err").textContent="内置需填 builtin_server"; return; }
      const rq=csv(F("cn-breq").value), rb=csv(F("cn-bbin").value); if(rq.length)launch.requires=rq; if(rb.length)launch.requires_bin=rb;
    } else {
      launch={ command:F("cn-cmd").value.trim(), args:lines(F("cn-args").value) };
      if(!launch.command){ F("cn-err").textContent="第三方需填 command"; return; }
      const senv={}; lines(F("cn-senv").value).forEach(l=>{ const i=l.indexOf("="); if(i>0) senv[l.slice(0,i).trim()]=l.slice(i+1).trim(); });
      if(Object.keys(senv).length) launch.secret_env=senv;
      const rq=csv(F("cn-sreq").value); if(rq.length) launch.requires=rq;
    }
    const data={ icon:F("cn-icon").value.trim(), name, desc:F("cn-desc").value.trim(), status:F("cn-status").value, launch };
    const id=F("cn-id").value, sort=Number(F("cn-sort").value)||0;
    try{ if(id) await api("PATCH","/catalog/item/"+id,{data,sort}); else await api("POST","/catalog",{category:"CONN_DEFS",data,sort}); connectorsManage(body); }
    catch(e){ F("cn-err").textContent=e.message; }
  };
  try{ const {items} = await api("GET","/catalog/CONN_DEFS?all=true");
    F("cn-list").innerHTML = items.length? items.map(it=>{ const d=it.data||{}, L=d.launch||{}; const lsum=L.builtin_server?("内置 · "+L.builtin_server):(L.command?("stdio · "+L.command+" "+((L.args||[]).join(" "))):"—"); return `<div class="list-item"><span style="font-size:20px">${esc(d.icon||"🔗")}</span><div style="flex:1;min-width:0"><div class="t">${esc(d.name||"?")} <span class="pill">${esc(d.status||"")}</span> ${it.enabled?"":'<span class="pill">停用</span>'}</div><div class="d" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lsum)}</div></div><button class="line" data-ed="${it.id}">编辑</button><button class="line" data-tog="${it.id}:${it.enabled?0:1}">${it.enabled?"停用":"启用"}</button><button class="danger" data-del="${it.id}">删除</button></div>`; }).join("") : '<div class="muted">还没有连接器目录项</div>';
    F("cn-list").querySelectorAll("[data-ed]").forEach(b=> b.onclick=()=>{ fill(items.find(x=>x.id===b.dataset.ed)); window.scrollTo(0,0); });
    F("cn-list").querySelectorAll("[data-tog]").forEach(b=> b.onclick=async()=>{ const [id,en]=b.dataset.tog.split(":"); try{ await api("PATCH","/catalog/item/"+id,{enabled:!!+en}); connectorsManage(body);}catch(e){F("cn-err").textContent=e.message;} });
    F("cn-list").querySelectorAll("[data-del]").forEach(b=> b.onclick=async()=>{ try{ await api("DELETE","/catalog/item/"+b.dataset.del); connectorsManage(body);}catch(e){F("cn-err").textContent=e.message;} });
    if(CONN_EDIT_ID){ const it=items.find(x=>x.id===CONN_EDIT_ID); CONN_EDIT_ID=null; if(it){ fill(it); window.scrollTo(0,0); } }  // 橱窗「编辑此连接器」带来的项，自动载入编辑（WB-101）
  }catch(e){ F("cn-list").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

    <div class="sg-grid sg-g4">${items.map((f,i)=>sgFcard(f,i)).join("")}</div>`;
  document.getElementById("sg-refresh").onclick=()=>{ SG_FEAToff=(SG_FEAToff+n)%feats.length; sgFeatured(el); };
  el.querySelectorAll("[data-fi]").forEach(c=> c.onclick=()=> sgDetail(items[+c.dataset.fi].card));
}
async function sgReco(sb){
  sb.innerHTML=`<div id="sg-reco" class="muted" style="margin-top:14px">加载中…</div>`;
  let list=[];
  try{ const {items}=await api("GET","/catalog/SK_GRID"); list=(items||[]).map(it=>it.data).filter(d=>Array.isArray(d)); }catch(e){}
  const el=document.getElementById("sg-reco"); el.className="";
  el.innerHTML = list.length? `<div class="sg-grid sg-g4">${list.map(sgScard).join("")}</div>` : '<div class="sg-blank">暂无推荐技能</div>';
}
function sgKits(sb){ sb.innerHTML=`<div class="sg-grid sg-g2" style="margin-top:14px">${SG_KITS.map(sgKit).join("")}</div>`; }
async function sgSkillhub(sb){
  sb.innerHTML=`<div id="sg-cathead"></div><div id="sg-hublist" class="muted" style="margin-top:4px">加载中…</div>`;
  let mirror=[], cats=[];
  try{ const {items}=await api("GET","/catalog/skill"); mirror=(items||[]).map(it=>it.data).filter(Boolean); }catch(e){}
  try{ const {items}=await api("GET","/catalog/skill-category"); cats=(items&&items[0]&&items[0].data&&items[0].data.items)||[]; }catch(e){}
  const head=document.getElementById("sg-cathead"), list=document.getElementById("sg-hublist");
  let chips, cards;
  if(mirror.length){
    chips=["全部",...cats.filter(c=>c.count>0).map(c=>c.name)];
    cards=mirror.filter(c=> SG_CAT==="全部" || c.skillhub_category_name===SG_CAT);
  } else {
    chips=SG_CATS;
    cards=SG_GRID.filter(t=> SG_CAT==="全部" || t[6]===SG_CAT).map(t=>({label:t[0],color:t[1],name:t[2],description:t[3],downloads:t[4],stars:t[5],skillhub_category_name:t[6]}));
  }
  head.innerHTML=sgCathead(chips);
  head.querySelectorAll("[data-cat]").forEach(b=> b.onclick=()=>{ SG_CAT=b.dataset.cat; sgSkillhub(sb); });
  list.className="";
  list.innerHTML = cards.length? `<div class="sg-grid sg-g4">${cards.map((c,i)=>sgHcard(c,i)).join("")}</div>` : '<div class="sg-blank">该分类下暂无技能</div>';
  SG_LAST=cards; list.querySelectorAll("[data-hi]").forEach(c=> c.onclick=()=> sgDetail(SG_LAST[+c.dataset.hi]));
}
async function sgSearch(main){
  main.className="";
  main.innerHTML=`<div class="sg-sectitle" style="margin:6px 0 12px">搜索「${esc(SG_Q)}」</div><div id="sg-sr" class="muted">搜索中…</div>`;
  const el=document.getElementById("sg-sr");
  try{ const r=await api("GET","/catalog/skills/search?q="+encodeURIComponent(SG_Q)+"&limit=40");
    if(r && r.cli===false){ el.className=""; el.innerHTML='<div class="sg-blank">SkillHub CLI 不可用，无法实时搜索</div>'; return; }
    const results=(r&&r.results)||[]; el.className="";
    el.innerHTML = results.length? `<div class="sg-grid sg-g4">${results.map((c,i)=>sgHcard(c,i)).join("")}</div>` : '<div class="sg-blank">没有找到相关技能</div>';
    SG_LAST=results; el.querySelectorAll("[data-hi]").forEach(c=> c.onclick=()=> sgDetail(SG_LAST[+c.dataset.hi]));
  }catch(e){ el.className=""; el.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function sgDetail(c){
  if(!c) return;
  const badges=[c.skillhub_category_name, c.source?shSrc(c.source):""].filter(Boolean);
  const ic = c.iconUrl ? `<span class="sg-mic"><img src="${esc(c.iconUrl)}" style="width:100%;height:100%;object-fit:cover"></span>` : `<span class="sg-mic" style="background:${esc(c.color||'#2E7DF6')}">${esc(c.icon||c.label||(String(c.name||'?').trim()[0]||'?').toUpperCase())}</span>`;
  const stats=[];
  if(c.stars!=null) stats.push(`<span class="sg-hstat">★ ${c.stars||0}</span>`);
  if(c.downloads!=null) stats.push(`<span class="sg-hstat">⬇ ${sgDl(c.downloads)}</span>`);
  const ov=document.createElement("div"); ov.className="sg-overlay";
  ov.innerHTML=`<div class="sg-modal" role="dialog" aria-modal="true" aria-label="${esc(c.name||"技能")}">
    <div class="sg-mh">${ic}<div style="flex:1;min-width:0"><div class="sg-mtitle">${esc(c.name||c.slug||"?")}</div>
      <div class="sg-mtags">${badges.map(b=>`<span class="pill">${esc(b)}</span>`).join("")}${stats.join("")}</div></div>
      <button class="sg-mx" aria-label="关闭">×</button></div>
    <div class="sg-mbody"><div class="sg-msec" style="margin-top:0">能力介绍</div>
      <div class="sg-mdesc">${esc(c.description||"（无简介）")}</div>
      ${(c.tags&&c.tags.length)?`<div class="sg-msec">标签</div><div class="sg-mtags">${c.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>`:""}
    </div>
    <div class="sg-mfoot"><span class="muted" style="font-size:12px">Hub 门户为浏览视图；安装/试用在 WorkBuddy 客户端</span><div class="grow"></div><a class="sg-mlink" href="https://skillhub.cn" target="_blank" rel="noopener">skillhub.cn ↗</a></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener("keydown",onkey); };
  function onkey(e){ if(e.key==="Escape") close(); }
  ov.onmousedown=e=>{ if(e.target===ov) close(); };
  ov.querySelector(".sg-mx").onclick=close;
  document.addEventListener("keydown",onkey);
}

// SkillHub（WB-084 + WB-092 向真站对齐）：左筛选（发布来源/排序/场景）+ 右富卡片（图标/来源/★/⬇）。
// 排序/来源只用镜像已有字段（source·score·downloads·stars·installs）；「需 API Key 筛选、近期飙升/最近上新」
// SkillHub 榜单 feed 不提供该数据，诚实不做（见 WB-092）。搜索走 CLI 代理。
let SH_Q="", SH_CAT="", SH_SRC="", SH_SORT="score";
const SH_SORTS=[["score","推荐精选"],["downloads","下载量"],["stars","收藏量"],["installs","安装量"],["created_at","最近上新"]];
function shNum(n){ n=n||0; return n>=10000? (n/10000).toFixed(1)+"万" : String(n); }
function shSrc(s){ return s==="clawhub"?"ClawHub":(s==="enterprise"?"企业":(s==="community"?"社区":(s||""))); }
async function skillhubCat(body){
  const sideBtn=(v,l,cur)=>`<button class="line" data-v="${esc(v)}" style="text-align:left;${cur===v?'background:var(--chip)':''}">${l}</button>`;
  body.innerHTML = `
    <div class="card"><div class="row"><button id="sh-sync">手动同步 SkillHub</button><span class="muted" id="sh-msg" style="font-size:12.5px"></span></div>
      <div class="row" style="margin-top:10px"><input id="sh-q" placeholder="搜索 SkillHub（实时，走 CLI）" value="${esc(SH_Q)}"><button class="line" id="sh-search">搜索</button><button class="ghost" id="sh-clearq">清空</button></div></div>
    <div style="display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:start">
      <div class="card">
        <div class="muted" style="font-size:11px;margin-bottom:6px">发布来源</div>
        <div id="sh-src" style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px">${[["","全部"],["skillhub","SkillHub"],["clawhub","ClawHub"]].map(([v,l])=>sideBtn(v,l,SH_SRC)).join("")}</div>
        <div class="muted" style="font-size:11px;margin-bottom:6px">排序方式</div>
        <div id="sh-sort" style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px">${SH_SORTS.map(([v,l])=>sideBtn(v,l,SH_SORT)).join("")}</div>
        <div class="muted" style="font-size:11px;margin-bottom:6px">场景分类</div>
        <div id="sh-cats" style="display:flex;flex-direction:column;gap:4px"><span class="muted" style="font-size:12px">…</span></div>
      </div>
      <div id="sh-list" class="muted">加载中…</div>
    </div>`;
  const F=id=>document.getElementById(id);
  F("sh-sync").onclick=async()=>{ F("sh-msg").textContent="同步中…（跑 CLI，稍候）"; try{ const r=await api("POST","/catalog/skills/sync"); F("sh-msg").textContent="已同步："+(r.inserted!=null?(r.inserted+" 条"):JSON.stringify(r)); skillhubCat(body);}catch(e){F("sh-msg").textContent=e.message;} };
  F("sh-search").onclick=()=>{ SH_Q=F("sh-q").value.trim(); skillhubCat(body); };
  F("sh-q").onkeydown=(e)=>{ if(e.key==="Enter"){ SH_Q=F("sh-q").value.trim(); skillhubCat(body); } };
  F("sh-clearq").onclick=()=>{ SH_Q=""; skillhubCat(body); };
  F("sh-src").querySelectorAll("[data-v]").forEach(b=> b.onclick=()=>{ SH_SRC=b.dataset.v; SH_Q=""; skillhubCat(body); });
  F("sh-sort").querySelectorAll("[data-v]").forEach(b=> b.onclick=()=>{ SH_SORT=b.dataset.v; skillhubCat(body); });
  let featBySlug={};
  try{ const {items}=await api("GET","/catalog/SKILLHUB_FEATURED?all=true"); items.forEach(it=>{ if(it.data&&it.data.slug) featBySlug[it.data.slug]=it.id; }); }catch(e){}
  try{ const {items}=await api("GET","/catalog/skill-category?all=true"); const tax=(items[0]&&items[0].data&&items[0].data.items)||[];
    F("sh-cats").innerHTML = [sideBtn("","全部",SH_CAT)].concat(tax.map(c=>`<button class="line" data-cat="${esc(c.key)}" style="text-align:left;${SH_CAT===c.key?'background:var(--chip)':''}">${esc(c.name)} ${c.count||""}</button>`)).join("");
    F("sh-cats").querySelectorAll("[data-cat],[data-v]").forEach(b=> b.onclick=()=>{ SH_CAT=b.dataset.cat!==undefined?b.dataset.cat:b.dataset.v; SH_Q=""; skillhubCat(body); });
  }catch(e){}
  try{
    let skills, note="";
    if(SH_Q){ const r=await api("GET","/catalog/skills/search?q="+encodeURIComponent(SH_Q)+"&limit=40"); skills=(r.results||[]).map(d=>({data:d})); if(!r.cli) note='<div class="muted">SkillHub CLI 不可用，无法实时搜索（客户端会回退本地兜底）</div>'; }
    else {
      const {items}=await api("GET","/catalog/skill?all=true");
      skills=items.filter(it=>{ const d=it.data||{};
        if(SH_CAT && d.skillhub_category!==SH_CAT) return false;
        if(SH_SRC==="clawhub" && d.source!=="clawhub") return false;
        if(SH_SRC==="skillhub" && !(d.source==="community"||d.source==="enterprise")) return false;
        return true; });
      skills.sort((a,b)=> (b.data[SH_SORT]||0)-(a.data[SH_SORT]||0));
    }
    F("sh-list").innerHTML = note || (skills.length? `<div class="muted" style="font-size:12px;margin-bottom:8px">${skills.length} 个技能${SH_Q?"（搜索）":""}</div>`+skills.slice(0,80).map(it=>{ const d=it.data||{}; const fid=featBySlug[d.slug];
      return `<div class="list-item">${d.iconUrl?`<img src="${esc(d.iconUrl)}" style="width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--chip);flex-shrink:0" onerror="this.style.display='none'">`:`<span style="font-size:22px">🧩</span>`}<div style="flex:1;min-width:0"><div class="t">${esc(d.name||d.slug||"?")} ${d.source?`<span class="pill">${esc(shSrc(d.source))}</span>`:""} ${d.skillhub_category_name?`<span class="pill">${esc(d.skillhub_category_name)}</span>`:""} ${d.stars?`<span class="muted" style="font-size:11px">★${d.stars}</span>`:""} ${d.downloads?`<span class="muted" style="font-size:11px">⬇${shNum(d.downloads)}</span>`:""}</div><div class="d" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.description||"")}</div></div><button class="${fid?'ghost':'line'}" data-feat="${esc(d.slug||"")}">${fid?"取消精选":"加入精选"}</button></div>`; }).join("") : '<div class="muted">无结果</div>');
    F("sh-list").querySelectorAll("[data-feat]").forEach(b=> b.onclick=async()=>{ const slug=b.dataset.feat, fid=featBySlug[slug]; try{ if(fid) await api("DELETE","/catalog/item/"+fid); else { const sk=skills.find(x=>x.data.slug===slug); await api("POST","/catalog",{category:"SKILLHUB_FEATURED",data:sk.data,kind:"featured"}); } skillhubCat(body);}catch(e){F("sh-msg").textContent=e.message;} });
    F("sh-msg").textContent = `${Object.keys(featBySlug).length} 个已精选`;
  }catch(e){ F("sh-list").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

// 高级 JSON（保留裸目录项编辑，供特殊类别 / 兜底）
async function rawCat(body){
  body.innerHTML = `<div class="card"><h3>新增目录项（裸 JSON）</h3>
      <div class="field"><label>分类 category（如 AUTO / PROJ_TPL / INSP）</label><input id="c-cat" placeholder="AUTO"></div>
      <div class="field"><label>data（JSON：数组或对象）</label><textarea id="c-data" placeholder='["🆕","名称",...]'></textarea></div>
      <div class="row"><input id="c-sort" type="number" value="0" style="width:90px"><span class="muted" style="font-size:12px">排序</span><div class="grow"></div><button id="c-add">新增</button></div>
      <div class="err" id="c-err"></div></div>
    <div id="c-list" class="muted">加载中…</div>`;
  document.getElementById("c-add").onclick = async ()=>{
    document.getElementById("c-err").textContent="";
    let data; try{ data = JSON.parse(document.getElementById("c-data").value); }catch(e){ document.getElementById("c-err").textContent="data 不是合法 JSON"; return; }
    try{ await api("POST","/catalog",{category:document.getElementById("c-cat").value.trim(), data, sort:Number(document.getElementById("c-sort").value)||0}); rawCat(body); }
    catch(e){ document.getElementById("c-err").textContent=e.message; }
  };
  try{ const {items} = await api("GET","/catalog?all=true");
    document.getElementById("c-list").innerHTML = items.length? items.map(it=>`<div class="list-item"><div style="flex:1;min-width:0"><div class="t">${esc(it.category)} <span class="pill">sort ${it.sort}</span>${it.enabled?"":' <span class="pill">停用</span>'}</div><div class="d" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(it.data))}</div></div><button class="danger" data-del="${it.id}">删除</button></div>`).join("") : '<div class="muted">Hub 目录为空（客户端将回落本地 builtin 兜底）</div>';
    body.querySelectorAll("[data-del]").forEach(b=> b.onclick=async()=>{ try{ await api("DELETE","/catalog/item/"+b.dataset.del); rawCat(body);}catch(e){document.getElementById("c-err").textContent=e.message;} });
  }catch(e){ document.getElementById("c-list").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

// ---------- 设置（WB-095）：平台管理员维护 SkillHub API key ----------
async function settingsView(m){
  m.innerHTML = `<h1>设置</h1><div class="sub">平台服务端凭据 / 配置</div>
    <div class="card"><h3>SkillHub API Key</h3>
      <div id="sk-status" class="muted" style="margin-bottom:10px">加载中…</div>
      <div class="field"><label>API Key（skh_ 个人 / sk-ent- 企业）</label><input id="sk-key" placeholder="skh_… 或 sk-ent-…"></div>
      <div class="err" id="sk-err"></div>
      <div class="row"><button id="sk-save">保存</button><button class="danger" id="sk-clear">清除</button></div>
      <div class="muted" style="font-size:12px;margin-top:10px">存于 Hub 服务端（仅打码回显、绝不回传全 key）。读公开目录本不需要 key；配了则取数带 Bearer（可解锁 paid / 企业私有 registry）。</div>
    </div>`;
  async function load(){
    try{ const s=(await api("GET","/settings")).skillhub_api_key;
      document.getElementById("sk-status").innerHTML = s.configured? `已配置 · <code>${esc(s.hint)}</code>${s.kind?` · ${esc(s.kind)}`:""}` : "未配置";
    }catch(e){ document.getElementById("sk-status").innerHTML=`<span class="err">${esc(e.message)}</span>`; }
  }
  document.getElementById("sk-save").onclick=async()=>{ const k=document.getElementById("sk-key").value.trim(); document.getElementById("sk-err").textContent=""; if(!k){document.getElementById("sk-err").textContent="请输入 key";return;} try{ await api("PUT","/settings/skillhub-key",{key:k}); document.getElementById("sk-key").value=""; load(); }catch(e){document.getElementById("sk-err").textContent=e.message;} };
  document.getElementById("sk-clear").onclick=async()=>{ try{ await api("DELETE","/settings/skillhub-key"); load(); }catch(e){document.getElementById("sk-err").textContent=e.message;} };
  load();
}

boot();
