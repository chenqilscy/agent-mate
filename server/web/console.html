<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentMate Console · Web 管理控制台</title>
<style>
  :root { --bg:#0f1420; --panel:#161c2b; --panel2:#1d2436; --line:#2a3348; --ink:#e7ecf5; --dim:#93a0b8; --brand:#16b37a; --brand2:#2e7df6; --danger:#ef4444; --chip:#232c40; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--brand2); }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 14px; background:var(--brand); color:#fff; font-weight:600; }
  button.ghost { background:var(--chip); color:var(--ink); }
  button.line { background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  button.danger { background:transparent; border:1px solid var(--danger); color:var(--danger); font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea, select { font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--ink); }
  textarea { resize:vertical; min-height:60px; }
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:grid; place-items:center; color:#fff; font-weight:800; }
  .grow { flex:1; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--dim); }
  .badge.admin { background:rgba(46,125,246,.18); color:#7fb0ff; }
  .wrap { display:flex; max-width:1180px; margin:0 auto; }
  .nav { width:180px; padding:16px 10px; border-right:1px solid var(--line); min-height:calc(100vh - 51px); }
  .nav button { display:block; width:100%; text-align:left; background:transparent; color:var(--dim); font-weight:500; margin-bottom:2px; }
  .nav button.active { background:var(--panel2); color:var(--ink); }
  /* WB-131 导航/IA 重构：分区侧栏 + 顶栏铃铛 + 概览页（nv-/ov- 前缀防并发撞类名） */
  .nv-gtitle { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); opacity:.65; margin:16px 12px 6px; }
  .nv-group:first-child .nv-gtitle { margin-top:2px; }
  .topbar .bell { position:relative; background:transparent; color:var(--dim); padding:5px 8px; font-size:16px; }
  .topbar .bell:hover { color:var(--ink); }
  .topbar .bell .ndot { position:absolute; top:2px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--danger); display:none; }
  .ov-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .ov-stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .ov-val { font-size:28px; font-weight:800; line-height:1.1; }
  .ov-lbl { font-size:12.5px; color:var(--dim); margin-top:3px; }
  .ov-sub { font-size:11px; color:var(--brand); margin-top:4px; }
  .ov-links { display:flex; flex-wrap:wrap; gap:8px; }
  .main { flex:1; padding:22px 26px; min-width:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:15px; }
  .row { display:flex; gap:10px; align-items:center; }
  .list-item { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:var(--panel2); }
  .list-item .t { font-weight:600; }
  .list-item .d { color:var(--dim); font-size:12.5px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .muted { color:var(--dim); }
  .dot { width:8px; height:8px; border-radius:50%; background:#4b5568; display:inline-block; }
  .dot.on { background:var(--brand); box-shadow:0 0 0 3px rgba(22,179,122,.2); }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--dim); }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
  .cmt { padding:9px 12px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); margin-bottom:7px; }
  .cmt .who { font-weight:600; font-size:12.5px; } .cmt .when { color:var(--dim); font-size:11px; }
  .err { color:var(--danger); font-size:12.5px; min-height:16px; }
  .hidden { display:none; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--dim); margin-bottom:16px; }
  .auth { max-width:380px; margin:8vh auto; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; } .tabs button { background:var(--chip); color:var(--dim); font-weight:500; }
  .tabs button.active { background:var(--brand); color:#fff; }
  code { background:var(--chip); padding:2px 6px; border-radius:5px; }
  /* 连接器浏览橱窗（WB-101）：对齐主应用 App 的 .conn 卡片布局，套 console 暗色 token。cg- 前缀防撞并发改动 */
  .cg-bar { margin-bottom:14px; }
  .cg-search { max-width:280px; }
  .cg-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
  .cg-card { display:flex; gap:12px; align-items:flex-start; padding:15px 16px; border:1px solid var(--line); border-radius:13px; background:var(--panel); cursor:pointer; transition:.15s; }
  .cg-card:hover { border-color:var(--brand); box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .cg-card:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .cg-ic { width:34px; height:34px; border-radius:9px; background:var(--chip); display:grid; place-items:center; font-size:17px; flex-shrink:0; }
  .cg-ic-lg { width:50px; height:50px; border-radius:12px; font-size:26px; }
  .cg-name { font-size:13.5px; font-weight:700; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .cg-desc { font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:4px; }
  .cg-badge { font-size:10px; font-weight:600; padding:1px 7px; border-radius:20px; }
  .cg-badge.rdy { background:rgba(22,179,122,.16); color:#37d39b; }
  .cg-badge.tok { background:rgba(231,163,62,.16); color:#e7a33e; }
  .cg-badge.off { background:var(--chip); color:var(--dim); }
  .cg-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:50; padding:20px; }
  .cg-modal { width:480px; max-width:100%; max-height:88vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  .cg-mh { display:flex; gap:12px; align-items:flex-start; padding:18px 18px 12px; border-bottom:1px solid var(--line); }
  .cg-mname { font-size:18px; font-weight:800; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .cg-mtags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cg-x { background:transparent; color:var(--dim); font-size:22px; font-weight:400; padding:0 6px; }
  .cg-mb { padding:14px 18px; }
  .cg-sec { font-size:12px; color:var(--dim); font-weight:600; margin:14px 0 6px; }
  .cg-sec:first-child { margin-top:0; }
  .cg-mdesc { font-size:13px; line-height:1.7; color:var(--ink); }
  .cg-mf { display:flex; gap:8px; align-items:center; padding:12px 18px; border-top:1px solid var(--line); }
  /* ---- 专家 · 专家团 浏览橱窗（WB-100，App 同款布局，适配控制台 dark token）---- */
  .sec-title { font-size:14px; font-weight:700; margin:22px 0 12px; }
  .scene-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .scene-card { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel); cursor:pointer; transition:.15s; }
  .scene-card:hover { border-color:var(--brand); }
  .sc-top { height:58px; background:linear-gradient(135deg,rgba(22,179,122,.22),rgba(46,125,246,.22)); display:flex; align-items:flex-end; padding:10px 12px; font-size:14px; font-weight:800; }
  .sc-list { padding:8px 6px 10px; }
  .sc-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; font-size:12.5px; color:var(--dim); }
  .sc-item:hover { background:var(--chip); color:var(--ink); }
  .sc-item .av { width:20px; height:20px; border-radius:6px; background:var(--chip); display:grid; place-items:center; font-size:11px; flex-shrink:0; }
  .subtabs { display:flex; align-items:center; gap:16px; margin:20px 0 4px; border-bottom:1px solid var(--line); }
  .subtab { padding:8px 2px; font-size:13.5px; font-weight:600; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subtab:hover { color:var(--ink); }
  .subtab.active { color:var(--ink); border-bottom-color:var(--brand); }
  .cats { display:flex; gap:7px; flex-wrap:wrap; margin:16px 0; }
  .cat { padding:5px 12px; border-radius:20px; font-size:12px; color:var(--dim); cursor:pointer; background:var(--chip); }
  .cat:hover { color:var(--ink); }
  .cat.active { background:var(--brand); color:#fff; }
  .card-grid { display:grid; gap:14px; }
  .card-grid.g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .card-grid.g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (max-width:1080px){ .card-grid.g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .ecard { border:1px solid var(--line); border-radius:13px; padding:15px; background:var(--panel); transition:.15s; cursor:pointer; }
  .ecard:hover { border-color:var(--brand); }
  .ecard.off { opacity:.55; }
  .ec-h { display:flex; gap:11px; align-items:flex-start; }
  .ec-av { width:38px; height:38px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:18px; flex-shrink:0; }
  .ec-n { font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ec-n .b { font-size:9.5px; font-weight:700; color:var(--brand); background:rgba(22,179,122,.16); padding:1px 6px; border-radius:6px; }
  .ec-s { font-size:11px; color:var(--dim); margin-top:2px; }
  .ec-d { font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:10px; min-height:34px; }
  .ec-tags { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .ec-tag { font-size:10.5px; color:var(--ink); background:var(--chip); padding:2px 8px; border-radius:6px; }
  .cap-blank { padding:48px 0; text-align:center; color:var(--dim); font-size:13.5px; }
  /* 详情 / 编辑弹窗（复用 App .np-* 骨架，适配 dark token）*/
  .np-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:150; padding:20px; }
  .np-overlay.open { display:flex; }
  .np-modal { width:520px; max-width:100%; max-height:92vh; background:var(--panel); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
  .np-h { display:flex; align-items:center; gap:12px; padding:18px 22px 8px; font-size:16px; font-weight:800; flex-shrink:0; }
  .np-x { margin-left:auto; width:28px; height:28px; border-radius:8px; background:transparent; color:var(--dim); font-size:19px; line-height:1; display:grid; place-items:center; padding:0; }
  .np-x:hover { background:var(--chip); }
  .np-body { padding:6px 22px 12px; overflow-y:auto; }
  .np-foot { display:flex; align-items:center; gap:10px; padding:14px 22px 18px; border-top:1px solid var(--line); flex-shrink:0; }
  /* WB-219 技能编辑弹窗 + 文本文件管理：沿用 np 弹窗与现有 token，不引入新视觉体系。 */
  .sk-edit-modal { width:920px; }
  .sk-edit-tabs { display:flex; gap:18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .sk-edit-tab { background:transparent; color:var(--dim); border-radius:0; padding:8px 2px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .sk-edit-tab.active { color:var(--ink); border-bottom-color:var(--brand); }
  .sk-workspace { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:430px; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--panel2); }
  .sk-explorer { min-width:0; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .sk-explorer-head { display:flex; align-items:center; gap:7px; padding:10px 11px; border-bottom:1px solid var(--line); }
  .sk-explorer-head b { font-size:12.5px; }
  .sk-explorer-head button { padding:4px 8px; font-size:12px; }
  .sk-tree-search { border:0; border-bottom:1px solid var(--line); border-radius:0; padding:8px 11px; font-size:12px; background:transparent; }
  .sk-tree { padding:7px; overflow:auto; flex:1; }
  .sk-tree-row { width:100%; display:flex; align-items:center; gap:6px; padding:6px 7px; border-radius:7px; background:transparent; color:var(--dim); font-weight:500; text-align:left; font-size:12px; }
  .sk-tree-row:hover { background:var(--chip); color:var(--ink); }
  .sk-tree-row.active { background:var(--chip); color:var(--ink); }
  .sk-tree-row .sk-twist { width:10px; color:var(--dim); flex-shrink:0; }
  .sk-tree-row .sk-tree-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sk-tree-empty { padding:16px 8px; color:var(--dim); font-size:12px; text-align:center; }
  .sk-editor { min-width:0; display:flex; flex-direction:column; }
  .sk-editor-head { min-height:49px; display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); }
  .sk-editor-head code { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sk-editor-head button { padding:5px 9px; font-size:12px; }
  .sk-editor-body { padding:12px; overflow:auto; flex:1; }
  .sk-code-editor { min-height:260px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; line-height:1.65; }
  .sk-code-editor[readonly] { color:var(--dim); }
  .sk-editor-foot { display:flex; align-items:center; gap:8px; min-height:48px; padding:9px 12px; border-top:1px solid var(--line); }
  .sk-editor-foot button { padding:6px 10px; font-size:12px; }
  .sk-unsaved { color:#e7a33e; font-size:11px; }
  .sk-manage-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .sk-manage-filters input { min-width:220px; flex:1; }
  .sk-manage-filters select { min-width:120px; }
  .sk-row-actions { position:relative; flex-shrink:0; }
  .sk-row-actions summary { list-style:none; cursor:pointer; border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:12px; color:var(--ink); background:var(--panel2); }
  .sk-row-actions summary::-webkit-details-marker { display:none; }
  .sk-row-menu { position:absolute; right:0; top:calc(100% + 5px); z-index:20; min-width:132px; padding:6px; border:1px solid var(--line); border-radius:9px; background:var(--panel); box-shadow:0 10px 30px rgba(0,0,0,.18); display:grid; gap:3px; }
  .sk-row-menu button { width:100%; text-align:left; background:transparent; color:var(--ink); }
  .sk-row-menu button:hover { background:var(--panel2); }
  .sk-tool-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .sk-tool-option { display:flex; align-items:flex-start; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
  .sk-tool-option input { width:auto; margin-top:2px; }
  .sk-tool-option b { display:block; font-size:12px; }
  .sk-tool-option small { display:block; color:var(--dim); margin-top:2px; line-height:1.4; }
  .required { color:#ef4444; font-size:11px; margin-left:4px; }
  @media (max-width:760px){
    .sk-workspace { grid-template-columns:1fr; }
    .sk-explorer { border-right:0; border-bottom:1px solid var(--line); max-height:210px; }
    .sk-code-editor { min-height:210px; }
  }
  @media (max-width:640px){
    .np-overlay { padding:10px; }
    .np-modal { max-height:96vh; border-radius:12px; }
    .np-modal .grid2 { grid-template-columns:1fr; gap:0; }
    .np-h { padding:15px 16px 8px; }
    .np-body { padding:6px 16px 10px; }
    .np-foot { padding:12px 16px 14px; }
  }
  .pkc-row { display:flex; gap:11px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:var(--panel2); }
  .pkc-row .pi { width:26px; height:26px; border-radius:7px; background:var(--chip); display:grid; place-items:center; font-size:14px; flex-shrink:0; }
  .pkc-row .pn { font-size:13.5px; font-weight:700; }
  .pkc-row .pd { font-size:11.8px; color:var(--dim); margin-top:3px; }
  /* AgentMate 自有技能目录预览；第三方 SkillHub 不进入 Server（WB-215）。 */
  .sg-sectitle { font-size:14px; font-weight:700; margin:22px 0 12px; }
  .sg-grid { display:grid; gap:14px; }
  .sg-g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .sg-g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (max-width:1080px){ .sg-g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .sg-blank { padding:44px 0; text-align:center; color:var(--dim); font-size:13.5px; }
  .sg-click { cursor:pointer; }
  .sg-flexright { display:flex; align-items:center; justify-content:space-between; }
  .sg-rt { font-size:12px; color:var(--dim); cursor:pointer; -webkit-user-select:none; user-select:none; }
  .sg-rt:hover { color:var(--brand); }
  .sg-seg { display:flex; gap:20px; align-items:baseline; margin:22px 0 2px; }
  .sg-seg-item { font-size:15px; font-weight:700; color:var(--dim); cursor:pointer; }
  .sg-seg-item.active { color:var(--ink); }
  .sg-cathead { display:flex; align-items:flex-start; gap:12px; margin:14px 0 6px; }
  .sg-cats { flex:1; display:flex; gap:7px; flex-wrap:wrap; }
  .sg-cat { padding:5px 12px; border-radius:20px; font-size:12px; color:var(--dim); cursor:pointer; background:var(--chip); }
  .sg-cat:hover { color:var(--ink); }
  .sg-cat.active { background:var(--brand); color:#fff; }
  .sg-cathead-r { flex-shrink:0; margin-top:4px; }
  .sg-link { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--dim); text-decoration:none; white-space:nowrap; }
  .sg-link:hover { color:var(--brand); }
  .sg-fcard { position:relative; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:14px; padding:15px 16px; background:var(--panel); transition:.15s; overflow:hidden; }
  .sg-fcard:hover { border-color:var(--brand); }
  .sg-fbadge { position:absolute; top:0; right:0; font-size:10.5px; font-weight:600; color:var(--brand); background:rgba(22,179,122,.16); padding:3px 10px; border-bottom-left-radius:10px; }
  .sg-fh { display:flex; align-items:center; gap:11px; }
  .sg-fic { width:38px; height:38px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:20px; flex-shrink:0; overflow:hidden; }
  .sg-fn { flex:1; min-width:0; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-fd { font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:10px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sg-hcard { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:13px; padding:14px; background:var(--panel); transition:.15s; }
  .sg-hcard:hover { border-color:var(--brand); }
  .sg-hh { display:flex; align-items:center; gap:10px; }
  .sg-hic { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:14px; font-weight:800; color:#fff; flex-shrink:0; overflow:hidden; }
  .sg-hn { flex:1; min-width:0; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-hd { flex:1; font-size:11.8px; color:var(--dim); line-height:1.55; margin-top:10px; min-height:52px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sg-hfoot { display:flex; align-items:center; gap:14px; margin-top:12px; }
  .sg-hstat { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--dim); }
  .sg-scard { border:1px solid var(--line); border-radius:13px; padding:14px; background:var(--panel); display:flex; gap:12px; transition:.15s; }
  .sg-scard:hover { border-color:var(--brand); }

  .pm-msbar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:12px; }

  /* 看板 */

  .pm-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pc,transparent); }
  .pm-card .tt { font-size:13px; font-weight:600; line-height:1.42; }
  .pm-cmeta { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; align-items:center; }
  .pm-tag { font-size:10px; color:var(--brand); background:rgba(22,179,122,.14); border-radius:5px; padding:1px 6px; }
  .pm-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--dim); background:var(--chip); border-radius:6px; padding:1px 7px; }
  .pm-chip.over { color:#ff9a9a; background:rgba(239,68,68,.15); }
  .pm-av { width:19px; height:19px; border-radius:50%; color:#fff; font-size:10px; font-weight:700; display:inline-grid; place-items:center; flex-shrink:0; }
  .pm-prio { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; }
  .pm-prio .pd2 { width:8px; height:8px; border-radius:2px; }
  /* 列表 */
  .pm-tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  .pm-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .pm-table th { text-align:left; padding:9px 12px; color:var(--dim); font-weight:600; border-bottom:1px solid var(--line); font-size:11.5px; background:var(--panel2); position:sticky; top:0; }
  .pm-table td { padding:10px 12px; border-bottom:1px solid var(--line); }
  .pm-table tbody tr { cursor:pointer; transition:background .1s; }
  .pm-table tbody tr:last-child td { border-bottom:none; }
  .pm-table tbody tr:hover { background:var(--panel2); }
  .pm-spill { display:inline-block; font-size:11px; font-weight:600; padding:2px 10px; border-radius:99px; }
  /* 甘特 */
  .pm-gantt-head { position:relative; height:18px; margin-bottom:8px; }

  .pm-gantt-track { position:relative; flex:1; height:24px; background:var(--panel2); border-radius:6px; overflow:hidden; }
  .pm-gantt-grid { position:absolute; top:0; bottom:0; width:1px; background:var(--line); }
  .pm-gantt-bar { position:absolute; top:4px; bottom:4px; border-radius:5px; cursor:pointer; opacity:.92; min-width:6px; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .pm-gantt-today { position:absolute; top:-4px; bottom:0; width:2px; background:var(--brand2); z-index:3; }
  .pm-gantt-today::after { content:"今天"; position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--brand2); white-space:nowrap; }
  /* 概览 */
  .pm-ovgrid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:14px; align-items:start; }
  @media (max-width:900px){ .pm-ovgrid { grid-template-columns:1fr; } .pm-board { grid-template-columns:repeat(2,1fr); } .pm-stats { grid-template-columns:repeat(2,1fr); } }
  .pm-msprog { margin-bottom:14px; }
  .pm-msprog .h { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
  .pm-msprog .h b { font-weight:600; }
  .pm-msprog .h span { color:var(--dim); font-size:11.5px; }
  .pm-actitem { display:flex; gap:9px; align-items:flex-start; padding:7px 0; font-size:12.5px; border-bottom:1px solid var(--line); }
  .pm-actitem:last-child { border-bottom:none; }
  .pm-actitem .ai { width:24px; height:24px; border-radius:7px; background:var(--chip); display:grid; place-items:center; font-size:12px; flex-shrink:0; }
  /* 看板/视图增强（WB-113）：泳道分组 + WIP 超限 + 批量条 */
  .pm-lane { margin-bottom:16px; }
  .pm-lanehead { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink); margin:0 0 8px; padding-left:2px; }
  .pm-lanehead .lav { flex-shrink:0; }

</head>
<body>
<div id="app"></div>
<script>
const API = ""; // same-origin
const TK = "agentmate.console.token";
let ME = null, VIEW = "overview", CUR = null; // CUR = open project
// WB-234：React Console 逐页迁移期间，旧页面固定在 /legacy 前缀下，避免导航回新路由。
const LEGACY_BASE = window.location.pathname === "/legacy" || window.location.pathname.startsWith("/legacy/") ? "/legacy" : "";

// WB-218：与 App 一致，把顶层视图映射到稳定 URL。Console 仍保持零构建单文件，
// 但页面可直达、可刷新，也能使用浏览器前进/后退。
const PAGE_ROUTES = {
  overview:"/", projects:"/projects", orgs:"/organizations", users:"/users", notifs:"/notifications",
};
const CATALOG_ROUTES = {
  experts:"/catalog/experts", connectors:"/catalog/connectors", skills:"/catalog/skills",
  knowledge:"/catalog/knowledge", raw:"/settings/catalog",
};
const PAGE_TITLES = {
  overview:"概览", projects:"项目", orgs:"组织与成员", users:"用户", notifs:"通知",
  experts:"专家", connectors:"连接器", skills:"技能", knowledge:"知识库", raw:"高级 JSON",
};

function cleanPath(path){ const p=(path||"/").replace(/\/+$/,""); return p||"/"; }
function decodePart(value){ try{return decodeURIComponent(value);}catch(e){return null;} }
function readPageRoute(pathname=window.location.pathname){
  const routedPath=LEGACY_BASE && pathname.startsWith(LEGACY_BASE) ? pathname.slice(LEGACY_BASE.length)||"/" : pathname;
  const path=cleanPath(routedPath);
  const page=Object.entries(PAGE_ROUTES).find(([,p])=>p===path);
  if(page) return {view:page[0],valid:true};
  const catalog=Object.entries(CATALOG_ROUTES).find(([,p])=>p===path);
  if(catalog) return {view:"catalog",catview:catalog[0],valid:true};
  const project=path.match(/^\/projects\/([^/]+)$/);
  if(project){ const id=decodePart(project[1]); if(id)return {view:"projects",projectId:id,valid:true}; }
  return {view:"overview",valid:false};
}
function pathForPage(view,catview,projectId){
  let path;
  if(view==="projects"&&projectId) path="/projects/"+encodeURIComponent(projectId);
  else if(view==="catalog") path=CATALOG_ROUTES[catview]||CATALOG_ROUTES.experts;
  else path=PAGE_ROUTES[view]||"/";
  return LEGACY_BASE+path;
}
function applyPageRoute(replaceInvalid=true){
  const route=readPageRoute();
  VIEW=route.view; CUR=route.projectId?{id:route.projectId}:null; PD=null;
  if(route.catview) CATVIEW=route.catview;
  if(!route.valid&&replaceInvalid) history.replaceState(null,"","/");
  return route;
}
function navigate(view,catview=null,projectId=null,replace=false){
  VIEW=view; CUR=projectId?{id:projectId}:null; PD=null;
  if(catview) CATVIEW=catview;
  const path=pathForPage(view,catview||CATVIEW,projectId);
  if(cleanPath(window.location.pathname)!==path) history[replace?"replaceState":"pushState"](null,"",path);
  render();
}

function tok(){ return localStorage.getItem(TK) || ""; }
function setTok(t){ t ? localStorage.setItem(TK,t) : localStorage.removeItem(TK); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ if(!ts) return ""; const s=Math.floor(Date.now()/1000-ts); if(s<60)return s+"秒前"; if(s<3600)return Math.floor(s/60)+"分前"; if(s<86400)return Math.floor(s/3600)+"小时前"; return Math.floor(s/86400)+"天前"; }

async function api(method, path, body){
  const r = await fetch(API+"/api"+path, {
    method,
    headers: Object.assign({}, tok()?{Authorization:"Bearer "+tok()}:{}, body?{"Content-Type":"application/json"}:{}),
    body: body?JSON.stringify(body):undefined,
  });
  let data=null; try{ data = await r.json(); }catch(e){}
  if(!r.ok){ const msg = (data&&data.detail)? (typeof data.detail==="string"?data.detail:JSON.stringify(data.detail)) : ("HTTP "+r.status); throw new Error(msg); }
  return data;
}
// 文件上传（WB-172）：发原始文件字节（配 Server 后端 request.stream()，免 multipart），文件名走 query。
// 现有 api() 只发 JSON，故单开此助手；鉴权头/错误处理与 api() 一致。
async function apiUpload(path, file){
  const r = await fetch(API+"/api"+path+(path.includes("?")?"&":"?")+"filename="+encodeURIComponent(file.name), {
    method:"POST",
    headers: Object.assign({}, tok()?{Authorization:"Bearer "+tok()}:{}),
    body: file,
  });
  let data=null; try{ data = await r.json(); }catch(e){}
  if(!r.ok){ const msg = (data&&data.detail)? (typeof data.detail==="string"?data.detail:JSON.stringify(data.detail)) : ("HTTP "+r.status); throw new Error(msg); }
  return data;
}

// ---------- auth ----------
async function boot(){
  applyPageRoute();
  if(tok()){ try{ ME = (await api("GET","/me")).account; }catch(e){ setTok(""); ME=null; } }
  render();
}
async function doAuth(kind, name, password){
  const res = await api("POST", kind==="register"?"/auth/register":"/auth/login", {name, password});
  setTok(res.token); ME = res.account; applyPageRoute(); render();
}
function logout(){ setTok(""); ME=null; render(); }

// ---------- render ----------
function render(){
  const app = document.getElementById("app");
  if(!ME){ document.title="登录 · AgentMate Console"; app.innerHTML = authView(); wireAuth(); return; }
  const admin = ME.is_platform_admin;
  // 侧栏隐藏之外也守住直达 URL：普通成员输入管理员页面地址时安全回概览。
  if(!admin&&(VIEW==="users"||VIEW==="catalog")){ navigate("overview",null,null,true); return; }
  document.title=(PAGE_TITLES[VIEW==="catalog"?CATVIEW:VIEW]||"AgentMate Console")+" · AgentMate Console";
  app.innerHTML = `
    <div class="topbar">
      <div class="logo">C</div><b>AgentMate Console</b><span class="badge">Web 控制台</span>
      <div class="grow"></div>
      <button class="bell" id="nav-bell" title="通知">🔔<span class="ndot" id="bell-dot"></span></button>
      <span>${esc(ME.name)}</span>${admin?'<span class="badge admin">平台管理员</span>':''}
      <button class="line" id="logout">退出</button>
    </div>
    <div class="wrap">
      <div class="nav">
        <div class="nv-group"><div class="nv-gtitle">工作区</div>
          ${nvItem("overview","概览")}${nvItem("projects","项目")}${nvItem("orgs","组织与成员")}
        </div>
        ${admin?`<div class="nv-group"><div class="nv-gtitle">目录</div>
          ${nvItem("catalog","专家","experts")}${nvItem("catalog","连接器","connectors")}${nvItem("catalog","技能","skills")}${nvItem("catalog","知识库","knowledge")}
        </div>`:""}
        ${admin?`<div class="nv-group"><div class="nv-gtitle">系统</div>
          ${nvItem("users","用户")}${nvItem("catalog","高级 JSON","raw")}
        </div>`:""}
      </div>
      <div class="main" id="main"></div>
    </div>`;
  document.getElementById("logout").onclick = logout;
  document.getElementById("nav-bell").onclick = ()=>navigate("notifs");
  document.querySelectorAll(".nav button").forEach(b=> b.onclick=()=>navigate(b.dataset.v,b.dataset.c||null));
  // 通知铃铛未读小红点（真取 /notifications，非模拟）
  (async()=>{ try{ const {notifications}=await api("GET","/notifications"); const u=(notifications||[]).filter(n=>!n.read).length; const d=document.getElementById("bell-dot"); if(d&&u>0) d.style.display="block"; }catch(e){} })();
  const m = document.getElementById("main");
  if(VIEW==="overview") overviewView(m);
  else if(VIEW==="projects") CUR? projectDetail(m) : projectsView(m);
  else if(VIEW==="orgs") orgsView(m);
  else if(VIEW==="users") usersView(m);
  else if(VIEW==="notifs") notifsView(m);
  else if(VIEW==="catalog") catalogView(m);
}
// 侧栏项：普通页按 VIEW 高亮；目录子页（catsec）按 VIEW===catalog && CATVIEW 高亮
function nvItem(view,label,catsec){
  const active = catsec ? (VIEW==="catalog" && CATVIEW===catsec) : (VIEW===view);
  return `<button data-v="${view}"${catsec?` data-c="${catsec}"`:""} class="${active?'active':''}">${label}</button>`;
}

function authView(){
  return `<div class="auth"><div class="card">
    <h1>AgentMate Console</h1><div class="sub">AgentMate Server Web 管理控制台 · 登录或注册</div>
    <div class="tabs"><button data-k="login" class="active">登录</button><button data-k="register">注册</button></div>
    <div class="field"><label>用户名</label><input id="au-name" autocomplete="username"></div>
    <div class="field"><label>密码（≥4 位）</label><input id="au-pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="au-err"></div>
    <button id="au-go" style="width:100%">登录</button>
    <div class="muted" style="margin-top:10px;font-size:12px">首个注册的账号会成为平台管理员。</div>
  </div></div>`;
}
function wireAuth(){
  let kind="login";
  document.querySelectorAll(".tabs button").forEach(b=> b.onclick=()=>{
    kind=b.dataset.k; document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    document.getElementById("au-go").textContent = kind==="login"?"登录":"注册";
  });
  document.getElementById("au-go").onclick = async ()=>{
    const n=document.getElementById("au-name").value.trim(), p=document.getElementById("au-pw").value;
    document.getElementById("au-err").textContent="";
    try{ await doAuth(kind, n, p); }catch(e){ document.getElementById("au-err").textContent=e.message; }
  };
}

// ---------- 概览 / 仪表盘（WB-131）：admin console 首屏，汇总真实数据（铁律#1，不造假；缺数据 catch→0） ----------
async function overviewView(m){
  const admin = ME.is_platform_admin;
  m.innerHTML = `<h1>概览</h1><div class="sub">AgentMate Console · Server 管理总览</div>
    <div id="ov-cards" class="muted">加载中…</div>`;
  const box = document.getElementById("ov-cards");
  const [proj, orgs, exp, conn, skill] = await Promise.all([
    api("GET","/projects").catch(()=>({projects:[]})),
    api("GET","/orgs").catch(()=>({orgs:[]})),
    admin?api("GET","/catalog/EXPERT_DEFS?all=true").catch(()=>({items:[]})):Promise.resolve({items:[]}),
    admin?api("GET","/catalog/CONN_DEFS?all=true").catch(()=>({items:[]})):Promise.resolve({items:[]}),

//    经 WB-171 存 Server)+有文档后锁维度。Console 不算向量：文档状态诚实标「未向量化」，绝不伪造「已向量化」。
//    复用 WB-169 已在文件里的 KB_EMBEDDINGS/KB_EMB_DIMS/kbDim/KB_KTYPES（见下方目录管理段）。

  if(d.vector_status===1) return '<span class="pill">✓ 已向量化</span>';
  if(d.vector_status===2) return `<span class="pill">✗ ${esc(d.fail_msg||"向量化失败")}</span>`;
  return '<span class="pill">未向量化 · 待执行面处理</span>';
}

// 概览：健康度统计 + 进度条 + 里程碑进度 + 近期任务活动。
async function pdTabOverview(body, pid){
  body.innerHTML = `<div id="pm-stats-slot"><div class="muted">加载中…</div></div>`;
  let items=[], miles=[], activity=[];
  try{
    const [wi, ms, ac] = await Promise.all([
      api("GET","/projects/"+pid+"/work-items"),
      api("GET","/projects/"+pid+"/milestones"),
      api("GET","/projects/"+pid+"/activity").catch(()=>({activity:[]})),
    ]);
    items=(wi.items||[]).filter(x=>!x.parent_id); miles=ms.milestones||[]; activity=ac.activity||[];
  }catch(e){ body.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const today = pmToday();
  const cnt = s => items.filter(x=>x.status===s).length;
  const total=items.length, done=cnt("done"), doing=cnt("doing"), todo=cnt("todo");
  const overdue = items.filter(x=>x.due_date && x.due_date<today && x.status!=="done").length;
  const pct = total? Math.round(done/total*100):0;
  const estH = items.reduce((a,x)=>a+(+x.estimate_h||0),0), spentH = items.reduce((a,x)=>a+(+x.spent_h||0),0);
  const msRows = miles.length ? miles.map(m=>{
    const mi=items.filter(x=>x.milestone_id===m.id), md=mi.filter(x=>x.status==="done").length;
    const mp = mi.length? Math.round(md/mi.length*100):0;
    return `<div class="pm-msprog"><div class="h"><b>🚩 ${esc(m.name)}${m.status==="closed"?" ✓":""}</b><span>${md}/${mi.length} · ${mp}%</span></div><div class="pm-bar"><i style="width:${mp}%"></i></div></div>`;
  }).join("") : '<div class="muted" style="font-size:12.5px">还没有里程碑</div>';
  const acts = activity.length ? activity.slice(0,12).map(x=>`<div class="pm-actitem"><div class="ai">${pmActIcon(x.kind)}</div><div style="flex:1;min-width:0"><div><b style="font-weight:600">${esc(x.actor||"?")}</b> ${esc(pmActLabel(x.kind))}${x.detail?` · ${esc(x.detail)}`:""}</div><div class="muted" style="font-size:11px;margin-top:1px">${ago(x.created_at)}</div></div></div>`).join("") : '<div class="muted" style="font-size:12.5px">暂无任务活动</div>';
  body.innerHTML = `
    <div class="pm-stats">

async function catalogOptions(category){

async function loadConfig(pid){

function pmActIcon(k){ k=String(k||""); if(k.includes("create"))return "✚"; if(k.includes("delete"))return "🗑"; if(k.includes("status")||k.includes("update"))return "✎"; if(k.includes("comment"))return "💬"; return "•"; }

// 筛选 + 排序（作用于全部视图，WB-107）。
function pmFiltered(){
  const f = PM_FILTER;
  let r = PM_CTX.items.filter(x=>!x.parent_id);
  if(f.q){ const q=f.q.toLowerCase(); r = r.filter(x=>(x.title||"").toLowerCase().includes(q)); }
  if(f.status) r = r.filter(x=>x.status===f.status);
  if(f.priority) r = r.filter(x=>(x.priority||"")===f.priority);
  if(f.assignee) r = r.filter(x=>x.assignee===f.assignee);
  if(f.milestone) r = r.filter(x=>x.milestone_id===f.milestone);
  const P = { urgent:4, high:3, medium:2, low:1, "":0 };
  if(PM_SORT==="priority") r = [...r].sort((a,b)=>(P[b.priority||""]||0)-(P[a.priority||""]||0));
  else if(PM_SORT==="due") r = [...r].sort((a,b)=>(a.due_date||"9999-99-99").localeCompare(b.due_date||"9999-99-99"));
  return r;
}
// 泳道分组（WB-113）：按负责人 / 里程碑 把过滤后的根任务分组，未指派/无里程碑排最后。
function pmGroups(roots, mode){
  const seen = new Map();
  roots.forEach(x=>{ const id = (mode==="assignee"? x.assignee : x.milestone_id) || ""; if(!seen.has(id)) seen.set(id,[]); seen.get(id).push(x); });
  const out = [];
  seen.forEach((items,id)=>{
    let label;
    if(mode==="assignee") label = id ? `${pmAvatar(items[0].assignee_name||id)}<span>${esc(items[0].assignee_name||id)}</span>` : '<span class="muted">未指派</span>';
    else label = id ? `🚩 ${esc(pmMsName(id))}` : '<span class="muted">无里程碑</span>';
    out.push({ id, label, items });
  });
  out.sort((a,b)=>(a.id?0:1)-(b.id?0:1));
  return out;
}

function pmViewWorkload(roots){
  const box=document.getElementById("pm-view");
  const today=pmToday();
  const groups=new Map();
  PM_CTX.members.forEach(m=> groups.set(m.account_id, {name:m.name, items:[]}));   // 成员即使 0 任务也列出
  roots.forEach(x=>{ const k=x.assignee||""; if(!groups.has(k)) groups.set(k, {name:(k?(x.assignee_name||k):"未指派"), items:[]}); groups.get(k).items.push(x); });
  const sum=(arr,k)=>arr.reduce((a,x)=>a+(+x[k]||0),0);
  const rows=[...groups.entries()].map(([id,g])=>{ const t=g.items.length, c=s=>g.items.filter(x=>x.status===s).length;

            est:sum(g.items,"estimate_h"), spent:sum(g.items,"spent_h")};
  });
  rows.sort((a,b)=> (a.id===""?1:0)-(b.id===""?1:0) || b.t-a.t);

        <span>待办 ${r.todo}</span><span style="color:#7fb0ff">进行 ${r.doing}</span><span style="color:#37d39b">完成 ${r.done} · ${r.pct}%</span>${r.overdue?`<span style="color:var(--danger)">逾期 ${r.overdue}</span>`:""}

// 甘特/时间线：按 start_date→due_date 画相对横条（无 start 用 due 当点）+ 今天标记 + 月度网格。
function pmViewGantt(roots){
  const box=document.getElementById("pm-view");
  const dated=roots.filter(x=>x.due_date||x.start_date);
  if(!dated.length){ box.innerHTML='<div class="pm-colempty" style="margin-top:8px">无排期任务 —— 给任务设开始/截止日期即可在此按时间轴排布</div>'; return; }
  const toD=s=>{ const a=String(s).split("-").map(Number); return Date.UTC(a[0],(a[1]||1)-1,a[2]||1)/86400000; };
  let min=Infinity,max=-Infinity;
  dated.forEach(x=>{ const s=toD(x.start_date||x.due_date), e=toD(x.due_date||x.start_date); if(s<min)min=s; if(e>max)max=e; });
  const tD=toD(pmToday()); if(tD<min)min=tD; if(tD>max)max=tD;   // 让今天线永远落在范围内
  if(max<=min) max=min+1;
  const pad=Math.max((max-min)*0.04,1); min-=pad; max+=pad;
  const range=max-min;
  const fmt=n=>{ const d=new Date(n*86400000); return (d.getUTCMonth()+1)+"/"+d.getUTCDate(); };
  const ticks=[0,.2,.4,.6,.8,1].map(f=>`<span style="left:${(f*100).toFixed(1)}%">${fmt(min+f*range)}</span>`).join("");
  const grid=[0,.2,.4,.6,.8,1].map(f=>`<div class="pm-gantt-grid" style="left:${(f*100).toFixed(1)}%"></div>`).join("");
  const todayL=((tD-min)/range*100).toFixed(1);
  const rows=dated.map(x=>{ const s=toD(x.start_date||x.due_date), e=toD(x.due_date||x.start_date); const left=((s-min)/range*100).toFixed(1), w=Math.max((e-s)/range*100,1.2).toFixed(1); const pc=(PM_PRIO[x.priority||""]||PM_PRIO[""])[1];
    return `<div class="pm-gantt-row"><div class="pm-gantt-name" data-open="${x.id}">${esc(x.title)}</div><div class="pm-gantt-track">${grid}<div class="pm-gantt-today" style="left:${todayL}%"></div><div class="pm-gantt-bar" data-open="${x.id}" title="${esc(x.start_date||"")} → ${esc(x.due_date||"")}" style="left:${left}%;width:${w}%;background:${pc}"></div></div></div>`;
  }).join("");
  box.innerHTML = `<div style="display:flex;gap:10px"><div style="width:160px;flex-shrink:0"></div><div class="pm-gantt-head" style="flex:1">${ticks}</div></div>${rows}`;
  pmBindOpen(box);
}

// 数据全来自 Server 目录（EXPERT_DEFS/EXPERT_RECOMMENDATIONS + EXP_SCENES/EXP_CATS/EXP_TEAMS）。
// 管理动作（编辑/停用·启用/删除）收进详情弹窗底部，新增/编辑复用表单装进弹窗，全套 CRUD 不丢。

// 轻量弹窗骨架（复用 .np-* 样式）：返回 overlay，[data-close] / 遮罩点击 / Esc 皆可关。
function expModal(inner, modalClass=""){
  const ov = document.createElement("div");
  ov.className = "np-overlay open";
  ov.innerHTML = `<div class="np-modal ${modalClass}" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener("mousedown", e=>{ if(e.target===ov) expClose(ov); });
  ov._onKey = e=>{ if(e.key==="Escape") expClose(ov); };
  document.addEventListener("keydown", ov._onKey);
  ov.querySelectorAll("[data-close]").forEach(b=> b.onclick=()=>expClose(ov));
  return ov;
}
function expClose(ov){ if(ov._onKey) document.removeEventListener("keydown", ov._onKey); ov.remove(); }

async function expertsCat(body){
  body.innerHTML = '<div class="muted">加载中…</div>';
  let scenes=[], cats=[], experts=[], teams=[];
  try{
    const [sc, ct, ex, tm] = await Promise.all([
      api("GET","/catalog/EXP_SCENES").catch(()=>({items:[]})),
      api("GET","/catalog/EXP_CATS").catch(()=>({items:[]})),
      api("GET","/catalog/EXPERT_DEFS?all=true").catch(()=>({items:[]})),
      api("GET","/catalog/EXP_TEAMS?all=true").catch(()=>({items:[]})),
    ]);
    scenes = sc.items||[];
    cats = (ct.items||[]).map(it=>it.data).filter(x=>typeof x==="string");
    experts = ex.items||[]; teams = tm.items||[];
  }catch(e){ body.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if(EXPSUB==="推荐位"){ expertRecommendationsView(body, experts); return; }
  const chips = ["全部", ...cats.filter(c=>c && c!=="全部")];
  if(!chips.includes(EXPCAT)) EXPCAT = "全部";
  const fExperts = experts.filter(it=> EXPCAT==="全部" || (it.data&&it.data.category===EXPCAT));
  const fTeams = teams.filter(it=> EXPCAT==="全部" || (it.data&&it.data.category===EXPCAT));
  const list = EXPSUB==="专家" ? fExperts : fTeams;

  body.innerHTML = `
    ${scenes.length?`<div class="sec-title" style="margin-top:2px">精选场景</div>
    <div class="scene-grid">${scenes.map((it,i)=>{ const d=it.data||[]; const title=d[0]||"", names=Array.isArray(d[1])?d[1]:[];
      return `<div class="scene-card" data-scene="${i}"><div class="sc-top">${esc(title)}</div><div class="sc-list">${names.map(n=>`<div class="sc-item"><span class="av">🧑</span>${esc(n)}</div>`).join("")}</div></div>`; }).join("")}</div>`:""}
    <div class="subtabs">
      <div class="subtab ${EXPSUB==="专家"?"active":""}" data-sub="专家">专家</div>
      <div class="subtab ${EXPSUB==="专家团"?"active":""}" data-sub="专家团">专家团</div>
      <div class="subtab" data-sub="推荐位">推荐位管理</div>
      <div class="grow"></div>
      <button id="ex-new">＋ 新增${EXPSUB}</button>
    </div>
    <div class="cats">${chips.map(c=>`<div class="cat ${EXPCAT===c?"active":""}" data-cat="${esc(c)}">${esc(c)}</div>`).join("")}</div>
    <div id="ex-grid"></div>`;

  const grid = document.getElementById("ex-grid");
  if(!list.length){ grid.innerHTML = `<div class="cap-blank">该分类下暂无${EXPSUB}</div>`; }
  else if(EXPSUB==="专家"){
    grid.innerHTML = `<div class="card-grid g4">${list.map(it=>{ const d=it.data||{}; const tags=d.tags||[];
      return `<div class="ecard ${it.enabled?"":"off"}" data-ex="${it.id}"><div class="ec-h"><div class="ec-av">${esc(d.avatar||"🧑")}</div><div style="flex:1;min-width:0"><div class="ec-n">${esc(d.name||"?")}${d.badge?`<span class="b">${esc(d.badge)}</span>`:""}${it.enabled?"":'<span class="pill">停用</span>'}</div><div class="ec-s">${esc(d.subtitle||"")}</div></div></div><div class="ec-d">${esc(d.intro||"")}</div><div class="ec-tags">${tags.map(t=>`<span class="ec-tag">${esc(t)}</span>`).join("")}</div></div>`; }).join("")}</div>`;
    grid.querySelectorAll("[data-ex]").forEach(c=> c.onclick=()=> expExpertDetail(body, experts.find(x=>x.id===c.dataset.ex)));
  } else {
    grid.innerHTML = `<div class="card-grid g4">${list.map(it=>{ const d=it.data||{}; const tags=d.tags||d.strengths||[];
      return `<div class="ecard ${it.enabled?"":"off"}" data-tm="${it.id}"><div class="ec-h"><div class="ec-av">${esc(d.icon||"👥")}</div><div style="flex:1;min-width:0"><div class="ec-n">${esc(d.name||"?")}${d.badge?`<span class="b">${esc(d.badge)}</span>`:""}<span class="pill">${(d.members||[]).length} 人</span>${it.enabled?"":'<span class="pill">停用</span>'}</div><div class="ec-s">${esc(d.source||"")}</div></div></div><div class="ec-d">${esc(d.intro||"")}</div><div class="ec-tags">${tags.map(t=>`<span class="ec-tag">${esc(t)}</span>`).join("")}</div></div>`; }).join("")}</div>`;
    grid.querySelectorAll("[data-tm]").forEach(c=> c.onclick=()=> expTeamDetail(body, teams.find(x=>x.id===c.dataset.tm)));
  }

  body.querySelectorAll("[data-sub]").forEach(b=> b.onclick=()=>{ EXPSUB=b.dataset.sub; expertsCat(body); });
  body.querySelectorAll("[data-cat]").forEach(b=> b.onclick=()=>{ EXPCAT=b.dataset.cat; expertsCat(body); });
  body.querySelectorAll("[data-scene]").forEach(b=> b.onclick=()=>{ EXPSUB="专家团"; EXPCAT="全部"; expertsCat(body); });
  document.getElementById("ex-new").onclick = ()=> EXPSUB==="专家" ? expExpertEdit(body,null) : expTeamEdit(body,null);
}

// 新增/编辑专家真定义（EXPERT_DEFS 对象；persona 会下行到 App 运行时）。
function expExpertEdit(body, it){
  const d = it? (it.data||{}) : {};
  const ov = expModal(`
    <div class="np-h"><div style="font-size:16px;font-weight:800">${it?"编辑专家":"新增专家"}</div><button class="np-x" data-close>×</button></div>
    <div class="np-body">
      <div class="grid2">
        <div class="field"><label>稳定 slug</label><input id="exe-slug" placeholder="senior-engineer" value="${esc(d.slug||"")}"></div>
        <div class="field"><label>图标 emoji</label><input id="exe-icon" placeholder="🚀" value="${esc(d.avatar||"")}"></div>
        <div class="field"><label>名称</label><input id="exe-name" value="${esc(d.name||"")}"></div>
        <div class="field"><label>副标题 / 作者</label><input id="exe-sub" value="${esc(d.subtitle||"")}"></div>
        <div class="field"><label>徽标（如 Beta，可空）</label><input id="exe-badge" value="${esc(d.badge||"")}"></div>
      </div>
      <div class="field"><label>简介</label><textarea id="exe-intro">${esc(d.intro||"")}</textarea></div>
      <div class="field"><label>运行人格 persona</label><textarea id="exe-persona">${esc(d.persona||"")}</textarea></div>
      <div class="grid2">
        <div class="field"><label>标签（逗号分隔）</label><input id="exe-tags" value="${esc((d.tags||[]).join(", "))}"></div>
        <div class="field"><label>分类</label><input id="exe-cat" list="exe-cats-dl" value="${esc(d.category||"")}"><datalist id="exe-cats-dl"></datalist></div>
      </div>
      <div class="row"><input id="exe-sort" type="number" value="${it?it.sort:0}" style="width:80px"><span class="muted" style="font-size:12px">排序</span></div>
      <div class="err" id="exe-err"></div>
    </div>
    <div class="np-foot"><div class="grow"></div><button class="ghost" data-close>取消</button><button id="exe-save">保存</button></div>`);
  catFlat("EXP_CATS").then(cs=>{ const dl=ov.querySelector("#exe-cats-dl"); if(dl) dl.innerHTML=cs.filter(c=>c!=="全部").map(c=>`<option value="${esc(c)}"></option>`).join(""); });
  const F = id=> ov.querySelector("#"+id);
  F("exe-save").onclick = async ()=>{
    F("exe-err").textContent="";
    const data={slug:F("exe-slug").value.trim(),avatar:F("exe-icon").value.trim()||"🧑",name:F("exe-name").value.trim(),subtitle:F("exe-sub").value.trim(),badge:F("exe-badge").value.trim(),intro:F("exe-intro").value.trim(),persona:F("exe-persona").value.trim(),tags:F("exe-tags").value.split(",").map(s=>s.trim()).filter(Boolean),category:F("exe-cat").value.trim(),source:"Server",functional:true};
    if(!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(data.slug)){ F("exe-err").textContent="slug 仅允许字母、数字与 . _ -"; return; }
    if(!data.name||!data.persona){ F("exe-err").textContent="名称和运行人格必填"; return; }
    const sort=Number(F("exe-sort").value)||0;
    try{ if(it) await api("PATCH","/catalog/item/"+it.id,{data,sort}); else await api("POST","/catalog",{category:"EXPERT_DEFS",data,sort}); expClose(ov); expertsCat(body); }
    catch(e){ F("exe-err").textContent=e.message; }
  };
}

// 新增/编辑专家团（EXP_TEAMS 对象）
function expTeamEdit(body, it){
  const d = it? (it.data||{}) : {};
  const membersText = (d.members||[]).map(mb=>`${mb.role||""},${mb.name||""},${mb.expert_slug||""}`).join("\n");
  const ov = expModal(`
    <div class="np-h"><div style="font-size:16px;font-weight:800">${it?"编辑专家团":"新增专家团"}</div><button class="np-x" data-close>×</button></div>
    <div class="np-body">
      <div class="grid2">
        <div class="field"><label>图标 emoji</label><input id="tme-icon" placeholder="🎨" value="${esc(d.icon||"")}"></div>
        <div class="field"><label>名称</label><input id="tme-name" value="${esc(d.name||"")}"></div>
        <div class="field"><label>来源 source</label><input id="tme-source" placeholder="平台出品" value="${esc(d.source||"")}"></div>
        <div class="field"><label>分类</label><input id="tme-cat" value="${esc(d.category||"")}"></div>
      </div>
      <div class="field"><label>徽标（如 特邀专家，可空）</label><input id="tme-badge" value="${esc(d.badge||"")}"></div>
      <div class="field"><label>简介</label><textarea id="tme-intro">${esc(d.intro||"")}</textarea></div>
      <div class="field"><label>擅长 strengths（逗号分隔，也用作 tags）</label><input id="tme-strengths" value="${esc((d.strengths||[]).join(", "))}"></div>
      <div class="field"><label>成员（每行一位「角色,显示名,专家 slug」，第一行为 lead）</label><textarea id="tme-members" placeholder="技术负责人,柯睿,senior-software-engineer&#10;前端工程师,像素匠,frontend-engineer">${esc(membersText)}</textarea><div class="muted" style="font-size:12px;margin-top:4px">专家 slug 必须引用已启用的专家真定义；Server 会拒绝不存在或重复的引用。</div></div>
      <div class="field"><label>示例提问（每行一条）</label><textarea id="tme-prompts">${esc((d.prompts||[]).join("\n"))}</textarea></div>
      <div class="row"><input id="tme-sort" type="number" value="${it?it.sort:0}" style="width:80px"><span class="muted" style="font-size:12px">排序</span></div>
      <div class="err" id="tme-err"></div>
    </div>
    <div class="np-foot"><div class="grow"></div><button class="ghost" data-close>取消</button><button id="tme-save">保存</button></div>`);
  const F = id=> ov.querySelector("#"+id);
  F("tme-save").onclick = async ()=>{
    F("tme-err").textContent="";
    const strengths=F("tme-strengths").value.split(",").map(s=>s.trim()).filter(Boolean);
    const members=F("tme-members").value.split("\n").map(s=>s.trim()).filter(Boolean).map((line,i)=>{ const p=line.split(","); const mb={role:(p[0]||"").trim(),name:(p[1]||"").trim(),expert_slug:(p[2]||"").trim()}; if(i===0)mb.lead=true; return mb; });
    const prompts=F("tme-prompts").value.split("\n").map(s=>s.trim()).filter(Boolean);
    const badge=F("tme-badge").value.trim();
    const data={ icon:F("tme-icon").value.trim(), name:F("tme-name").value.trim(), source:F("tme-source").value.trim(), category:F("tme-cat").value.trim(), intro:F("tme-intro").value.trim(), strengths, members, prompts, tags:strengths };
    if(badge) data.badge=badge;
    if(!data.name){ F("tme-err").textContent="名称必填"; return; }
    if(!members.length||members.some(m=>!m.role||!m.name||!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(m.expert_slug))){ F("tme-err").textContent="每位成员都必须填写角色、显示名和合法专家 slug"; return; }
    const sort=Number(F("tme-sort").value)||0;
    try{ if(it) await api("PATCH","/catalog/item/"+it.id,{data,sort}); else await api("POST","/catalog",{category:"EXP_TEAMS",data,sort}); expClose(ov); expertsCat(body); }
    catch(e){ F("tme-err").textContent=e.message; }
  };
}

// WB-221：专家推荐位只引用 EXPERT_DEFS；定义的 persona 与用户自定义专家均不复制到推荐记录。
async function expertRecommendationsView(body, experts){
  body.innerHTML=`<div class="subtabs"><div class="subtab" data-sub="专家">专家</div><div class="subtab" data-sub="专家团">专家团</div><div class="subtab active" data-sub="推荐位">推荐位管理</div></div>
    <div class="row" style="margin-bottom:14px"><div><h3 style="margin:0">专家推荐位</h3><div class="muted" style="font-size:12px">维护 App 专家页的推荐顺序与生效时间</div></div><div class="grow"></div><button id="exr-new">新增推荐</button></div>
    <div id="exr-list" class="muted">加载中…</div>`;
  body.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{EXPSUB=b.dataset.sub;expertsCat(body);});
  const F=id=>body.querySelector("#"+id), bySlug=new Map(experts.map(it=>[(it.data||{}).slug,it.data||{}]));
  try{
    const {items}=await api("GET","/catalog/EXPERT_RECOMMENDATIONS?all=true");
    F("exr-list").innerHTML=items.length?items.map(it=>{const d=it.data||{}, expert=bySlug.get(d.expert_slug)||{};return `<div class="list-item"><span style="font-size:20px">${esc(expert.avatar||"🧑")}</span><div class="grow"><div class="t">${esc(expert.name||d.expert_slug||"?")} ${it.enabled?"":'<span class="pill">停用</span>'}</div><div class="d">${esc(d.expert_slug||"")}</div></div><button class="line" data-ed="${it.id}">编辑</button><button class="line" data-tog="${it.id}:${it.enabled?0:1}">${it.enabled?"停用":"启用"}</button><button class="danger" data-del="${it.id}">删除</button></div>`;}).join(""):'<div class="muted">还没有专家推荐位</div>';
    F("exr-new").onclick=()=>expertRecommendationEditor(body,experts,null);
    F("exr-list").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>expertRecommendationEditor(body,experts,items.find(x=>x.id===b.dataset.ed)));
    F("exr-list").querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{const[id,en]=b.dataset.tog.split(":");try{await api("PATCH","/catalog/item/"+id,{enabled:!!+en});expertRecommendationsView(body,experts);}catch(e){F("exr-list").innerHTML=`<div class="err">${esc(e.message)}</div>`;}});
    F("exr-list").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{await api("DELETE","/catalog/item/"+b.dataset.del);expertRecommendationsView(body,experts);}catch(e){F("exr-list").innerHTML=`<div class="err">${esc(e.message)}</div>`;}});
  }catch(e){F("exr-list").innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

function expertRecommendationEditor(body,experts,it){
  const d=it?(it.data||{}):{};
  const ov=expModal(`<div class="np-h">${it?"编辑":"新增"}专家推荐<button class="np-x" data-close>×</button></div>
    <div class="np-body"><div class="field"><label>专家定义</label><select id="exre-slug">${experts.map(x=>{const v=x.data||{};return `<option value="${esc(v.slug||"")}">${esc(v.name||v.slug||"?")}</option>`;}).join("")}</select></div>
      <div class="grid2"><div class="field"><label>生效时间（可空）</label><input id="exre-start" type="datetime-local"></div><div class="field"><label>结束时间（可空）</label><input id="exre-end" type="datetime-local"></div></div>
      <div class="field"><label>排序</label><input id="exre-sort" type="number" style="width:90px"></div><div class="err" id="exre-err"></div></div>

// 只读详情浮层（WB-101）：管理台无会话/loadout/OAuth，不搬 App 的添加会话/去试试/连接授权；
// 提供「编辑此连接器」跳目录管理并载入该项。
function connectorDetail(it){
  if(!it) return;
  const d=it.data||{}, L=d.launch||{};
  const lsum = L.builtin_server ? ("内置 · "+L.builtin_server) : (L.command ? ("stdio · "+(L.command+" "+((L.args||[]).join(" "))).trim()) : "—");
  const badge = d.status==="rdy"?'<span class="cg-badge rdy">内置即用</span>':(d.status==="tok"?'<span class="cg-badge tok">需连接</span>':'');
  const off = it.enabled?"":'<span class="cg-badge off">停用</span>';
  const req = L.requires||[];
  const ov = document.createElement("div"); ov.className="cg-overlay";
  ov.innerHTML = `<div class="cg-modal" role="dialog" aria-modal="true" aria-label="${esc(d.name||"连接器")}">
    <div class="cg-mh"><div class="cg-ic cg-ic-lg">${esc(d.icon||"🔗")}</div>

    <div class="cg-mb">

      <div class="cg-sec">启动方式</div><div class="cg-mdesc"><code>${esc(lsum)}</code></div>
      ${req.length?`<div class="cg-sec">所需凭据（环境变量名）</div><div class="cg-mtags">${req.map(r=>`<span class="pill">${esc(r)}</span>`).join("")}</div>`:""}
    </div>
    <div class="cg-mf"><button class="line cg-edit">编辑此连接器</button><div class="grow"></div><button class="cg-close">关闭</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onmousedown = e=>{ if(e.target===ov) close(); };
  ov.querySelector(".cg-x").onclick = close;

  ov.querySelector(".cg-edit").onclick = ()=>{ close(); CONN_EDIT_ID=it.id; CONNSUB="manage"; render(); };
}

// 知识库模板目录（WB-145）：策展下发给 App 的「建库模板」。每条 = {key,name,desc,icon,embedding_id,

// 复用连接器同款 cg-* 橱窗 + 通用 manage 组件（视觉一致；纯前端，无后端改）。

async function knowledgeCat(body){

  const F=id=>ov.querySelector("#"+id), close=()=>{document.removeEventListener("keydown",onKey);ov.remove();};
  F("ske-slug").value=d.slug||"";F("ske-slug").readOnly=!!it;F("ske-name").value=d.name||"";F("ske-icon").value=d.icon||"";F("ske-cat").value=d.category||"";F("ske-desc").value=d.description||"";F("ske-instr").value=d.instructions||"";F("ske-source").value="Server";F("ske-version").value=it?String(it.version||1):"保存后生成";F("ske-sort").value=it?it.sort:0;
  ov.querySelectorAll('#ske-tools input[type="checkbox"]').forEach(box=>box.checked=(d.tools||[]).includes(box.value));const unknown=(d.tools||[]).filter(name=>!toolCatalog.some(tool=>tool.name===name));if(unknown.length)F("ske-tool-error").textContent="未支持工具已移除："+unknown.join(", ");
  function currentData(){return {slug:F("ske-slug").value.trim(),name:F("ske-name").value.trim(),icon:F("ske-icon").value.trim()||"🧩",category:F("ske-cat").value.trim(),description:F("ske-desc").value.trim(),instructions:F("ske-instr").value.trim(),tools:[...ov.querySelectorAll('#ske-tools input[type="checkbox"]:checked')].map(box=>box.value),files:files.map(f=>({...f})),source:"Server"};}
  let initialFingerprint=JSON.stringify({data:currentData(),sort:Number(F("ske-sort").value)||0});
  function isDirty(){return fileDirty||JSON.stringify({data:currentData(),sort:Number(F("ske-sort").value)||0})!==initialFingerprint;}
  function requestClose(){if(isDirty()&&!confirm("有尚未保存的技能修改，确定放弃吗？"))return;close();}
  const onKey=e=>{if(e.key==="Escape")requestClose();};document.addEventListener("keydown",onKey);
  function generatedSkillMarkdown(){const version=it?String(it.version||1):"1";return `---\nname: ${JSON.stringify(F("ske-name").value.trim())}\nslug: ${F("ske-slug").value.trim()}\ndescription: ${JSON.stringify(F("ske-desc").value.trim())}\nversion: ${JSON.stringify(version)}\nsource: agentmate\n---\n\n${F("ske-instr").value.trim()}\n`;}
  function setDirty(value){fileDirty=value;F("skf-dirty").classList.toggle("hidden",!value);F("skf-apply").disabled=!value;F("skf-revert").disabled=!value;}
  function showTab(next){tab=next;ov.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));F("ske-info").classList.toggle("hidden",tab!=="info");F("ske-files").classList.toggle("hidden",tab!=="files");if(tab==="files"){renderTree();loadFileEditor();}}
  function validFileDraft(index){
    const path=F("skf-path").value.replace(/\\/g,"/").trim(),content=F("skf-content").value,parts=path.split("/"),name=(parts[parts.length-1]||"").toLowerCase(),reserved=["skill.md","_skillhub_meta.json","_meta.json",".disabled"];
    F("ske-err").textContent="";
    if(!path||path.length>240||path.startsWith("/")||parts.some(p=>!p||p==="."||p===".."||p.includes(":"))){F("ske-err").textContent="请输入安全的相对路径";return null;}
    if(reserved.includes(name)){F("ske-err").textContent="该文件名由 AgentMate 保留";return null;}
    if(files.some((f,i)=>i!==index&&f.path.toLowerCase()===path.toLowerCase())){F("ske-err").textContent="文件路径不能重复";return null;}
    const projected=files.reduce((n,f,i)=>n+(i===index?0:new Blob([f.content]).size),0)+new Blob([content]).size;
    if(projected>1024*1024){F("ske-err").textContent="附加文件总计不能超过 1MB";return null;}
    return {path,content};
  }
  function applyFile(){
    if(selectedFile==="skill")return true;
    const index=selectedFile==="new"?-1:Number(selectedFile),row=validFileDraft(index);if(!row)return false;
    if(index<0){if(files.length>=128){F("ske-err").textContent="最多只能添加 128 个附加文件";return false;}files.push(row);selectedFile=files.length-1;}else files[index]=row;
    setDirty(false);renderTree();loadFileEditor();return true;
  }
  function selectFile(next){if(fileDirty&&!applyFile())return;selectedFile=next;loadFileEditor();renderTree();}
  function loadFileEditor(){
    const generated=selectedFile==="skill";
    F("skf-path-wrap").classList.toggle("hidden",generated);F("skf-instr").classList.toggle("hidden",!generated);F("skf-delete").classList.toggle("hidden",generated||selectedFile==="new");F("skf-apply").classList.toggle("hidden",generated);F("skf-revert").classList.toggle("hidden",generated);F("skf-content").readOnly=generated;
    if(generated){F("skf-current").textContent="SKILL.md";F("skf-kind").textContent="自动生成";F("skf-content-label").textContent="安装时生成的 SKILL.md（只读预览）";F("skf-content").value=generatedSkillMarkdown();F("skf-hint").textContent="由基本信息与技能指令实时生成";}
    else{const row=selectedFile==="new"?{path:"",content:""}:files[Number(selectedFile)];F("skf-current").textContent=row.path||"新文件";F("skf-kind").textContent=selectedFile==="new"?"新文件":"文本文件";F("skf-content-label").textContent="UTF-8 文本内容";F("skf-path").value=row.path;F("skf-content").value=row.content;F("skf-hint").textContent=selectedFile==="new"?"输入包含目录的相对路径即可创建目录":"修改先应用，再保存技能";}
    setDirty(false);
  }
  function renderTree(){
    F("skf-count").textContent=String(files.length+1);const q=treeQuery.trim().toLowerCase(),root={dirs:{},files:[]};
    files.forEach((file,index)=>{if(q&&!file.path.toLowerCase().includes(q))return;const parts=file.path.split("/"),name=parts.pop(),entry={name,path:file.path,index};let node=root;parts.forEach(part=>{node.dirs[part]||(node.dirs[part]={dirs:{},files:[]});node=node.dirs[part];});node.files.push(entry);});
    const rows=[];if(!q||"skill.md".includes(q))rows.push(`<button class="sk-tree-row ${selectedFile==="skill"?"active":""}" data-skill style="--sk-depth:0"><span class="sk-twist"></span><span>📄</span><span class="sk-tree-name">SKILL.md</span></button>`);
    function walk(node,prefix,depth){Object.keys(node.dirs).sort().forEach(name=>{const path=prefix?prefix+"/"+name:name,closed=collapsedDirs.has(path);rows.push(`<button class="sk-tree-row" data-dir="${esc(path)}" style="--sk-depth:${depth}"><span class="sk-twist">${closed?"▸":"▾"}</span><span>📁</span><span class="sk-tree-name">${esc(name)}</span></button>`);if(!closed)walk(node.dirs[name],path,depth+1);});node.files.sort((a,b)=>a.name.localeCompare(b.name)).forEach(file=>rows.push(`<button class="sk-tree-row ${selectedFile===file.index?"active":""}" data-file="${file.index}" title="${esc(file.path)}" style="--sk-depth:${depth}"><span class="sk-twist"></span><span>📄</span><span class="sk-tree-name">${esc(file.name)}</span></button>`));}
    walk(root,"",0);if(selectedFile==="new")rows.push(`<button class="sk-tree-row active" data-new style="--sk-depth:0"><span class="sk-twist"></span><span>📄</span><span class="sk-tree-name">新文件</span></button>`);F("skf-tree").innerHTML=rows.join("")||'<div class="sk-tree-empty">没有匹配的文件</div>';
    F("skf-tree").querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{const p=b.dataset.dir;collapsedDirs.has(p)?collapsedDirs.delete(p):collapsedDirs.add(p);renderTree();});F("skf-tree").querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>selectFile(Number(b.dataset.file)));const skill=F("skf-tree").querySelector("[data-skill]");if(skill)skill.onclick=()=>selectFile("skill");const fresh=F("skf-tree").querySelector("[data-new]");if(fresh)fresh.onclick=()=>selectFile("new");
  }
  ov.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const next=b.dataset.tab;if(next!=="files"&&fileDirty&&!applyFile())return;showTab(next);});
  F("skf-new").onclick=()=>{if(fileDirty&&!applyFile())return;selectedFile="new";treeQuery="";F("skf-search").value="";renderTree();loadFileEditor();F("skf-path").focus();};F("skf-search").oninput=()=>{treeQuery=F("skf-search").value;renderTree();};
  F("skf-path").oninput=()=>{F("skf-current").textContent=F("skf-path").value.trim()||"新文件";setDirty(true);};F("skf-content").oninput=()=>{if(selectedFile!=="skill")setDirty(true);};F("skf-apply").onclick=applyFile;F("skf-revert").onclick=loadFileEditor;
  F("skf-delete").onclick=()=>{if(selectedFile==="skill"||selectedFile==="new")return;const index=Number(selectedFile),name=files[index].path;if(!confirm(`删除文件「${name}」？`))return;files.splice(index,1);selectedFile="skill";renderTree();loadFileEditor();};
  F("skf-instr").onclick=()=>{showTab("info");F("ske-instr").focus();};
  F("ske-save").onclick=async()=>{F("ske-err").textContent="";if(fileDirty&&!applyFile()){showTab("files");return;}const data=currentData();if(!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(data.slug)){F("ske-err").textContent="slug 仅允许字母、数字与 . _ -";showTab("info");return;}if(!data.name||!data.description||!data.instructions){F("ske-err").textContent="名称、简介和技能指令均为必填项";showTab("info");return;}const button=F("ske-save"),label=button.textContent;button.disabled=true;button.textContent="保存中…";try{if(it)await api("PATCH","/catalog/item/"+it.id,{data,sort:Number(F("ske-sort").value)||0});else await api("POST","/catalog",{category:"APP_SKILLS",data,sort:Number(F("ske-sort").value)||0});initialFingerprint=JSON.stringify({data,sort:Number(F("ske-sort").value)||0});close();onSaved();}catch(e){F("ske-err").textContent=e.message;button.disabled=false;button.textContent=label;}};
  F("ske-cancel").onclick=requestClose;ov.querySelector(".np-x").onclick=requestClose;ov.onmousedown=e=>{if(e.target===ov)requestClose();};renderTree();showTab(tab);(it?F("ske-name"):F("ske-slug")).focus();
}

function recDateValue(v){ if(!v)return ""; const d=new Date(Number(v)*1000); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function recDateEpoch(v){ return v?Math.floor(new Date(v).getTime()/1000):0; }
function recActive(d){ const now=Date.now()/1000,s=Number(d.starts_at||0),e=Number(d.ends_at||0); return (!s||now>=s)&&(!e||now<e); }

async function skillsRecommendations(body){
  body.innerHTML = `<div class="row" style="margin-bottom:14px"><div><h3 style="margin:0">技能推荐位</h3><div class="muted" style="font-size:12px">维护 AgentMate 与 SkillHub 推荐卡片及其生效时间</div></div><div class="grow"></div><button id="skr-new">新增推荐</button></div><div id="skr-list" class="muted">加载中…</div>`;
  const F=id=>body.querySelector("#"+id);
  try{
    const [skillRes,recRes]=await Promise.all([api("GET","/catalog/APP_SKILLS?all=true"),api("GET","/catalog/SKILL_RECOMMENDATIONS?all=true")]);
    const skills=skillRes.items||[],items=recRes.items||[],skillMap=Object.fromEntries(skills.map(it=>[it.data&&it.data.slug,it.data||{}]));
    F("skr-list").innerHTML=items.length?items.map(it=>{const d=it.data||{},base=d.provider==="agentmate"?skillMap[d.skill_slug]||{}:{}; const state=!it.enabled?"停用":recActive(d)?"生效中":"未生效"; return `<div class="list-item"><span style="font-size:20px">${esc(d.icon||base.icon||(d.provider==="skillhub"?"✦":"🧩"))}</span><div style="flex:1;min-width:0"><div class="t">${esc(d.title||base.name||d.skill_slug||"?")} <span class="pill">${esc(d.provider||"")}</span> <span class="pill">${esc(d.skill_slug||"")}</span> <span class="pill">${state}</span></div><div class="d" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.description||base.description||d.placement||"")}</div></div><button class="line" data-ed="${it.id}">编辑</button><button class="line" data-tog="${it.id}:${it.enabled?0:1}">${it.enabled?"停用":"启用"}</button><button class="danger" data-del="${it.id}">删除</button></div>`;}).join(""):'<div class="muted">还没有推荐位；App 会继续使用本机 AgentMate 技能定义作为离线兜底</div>';
    F("skr-new").onclick=()=>skillRecommendationEditor(body,skills,null);
    F("skr-list").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>skillRecommendationEditor(body,skills,items.find(x=>x.id===b.dataset.ed)));
    F("skr-list").querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{const[id,en]=b.dataset.tog.split(":");try{await api("PATCH","/catalog/item/"+id,{enabled:!!+en});skillsRecommendations(body);}catch(e){F("skr-list").innerHTML=`<div class="err">${esc(e.message)}</div>`;}});
    F("skr-list").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{await api("DELETE","/catalog/item/"+b.dataset.del);skillsRecommendations(body);}catch(e){F("skr-list").innerHTML=`<div class="err">${esc(e.message)}</div>`;}});
  }catch(e){F("skr-list").innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

function skillRecommendationEditor(body,skills,it){
  const d=it?(it.data||{}):{},ov=expModal(`<div class="np-h">${it?"编辑":"新增"}技能推荐<button class="np-x" data-close>×</button></div><div class="np-body">
    <div class="grid2"><div class="field"><label>来源</label><select id="skre-provider"><option value="agentmate">AgentMate</option><option value="skillhub">SkillHub</option></select></div><div class="field"><label>技能 slug</label><input id="skre-slug" list="skre-skills" placeholder="skill-slug"><datalist id="skre-skills">${skills.map(x=>{const v=x.data||{};return `<option value="${esc(v.slug||"")}">${esc(v.name||v.slug||"")}</option>`;}).join("")}</datalist></div></div>
    <div class="grid2"><div class="field"><label>推荐位置</label><input value="skills.recommended" readonly></div><div class="field"><label>标题（AgentMate 可留空继承定义）</label><input id="skre-title"></div></div>
    <div class="grid2"><div class="field"><label>图标（可留空继承）</label><input id="skre-icon" placeholder="🧩"></div><div class="field"><label>分类（可留空继承）</label><input id="skre-category"></div></div>
    <div class="field"><label>推荐简介（SkillHub 必填）</label><textarea id="skre-desc"></textarea></div><div class="grid2"><div class="field"><label>生效时间（可空）</label><input id="skre-start" type="datetime-local"></div><div class="field"><label>结束时间（可空）</label><input id="skre-end" type="datetime-local"></div></div>
    <div class="field"><label>排序</label><input id="skre-sort" type="number" style="width:90px"></div><div class="muted" style="font-size:12px">SkillHub 推荐仅保存 slug 与展示文案；查询、Key、安装和文件内容仍在用户本机。</div><div class="err" id="skre-err"></div></div>
    <div class="np-foot"><div class="grow"></div><button class="line" data-close>取消</button><button id="skre-save">保存</button></div>`,"sk-edit-modal");
  const F=id=>ov.querySelector("#"+id);F("skre-provider").value=d.provider||"agentmate";F("skre-slug").value=d.skill_slug||"";F("skre-title").value=d.title||"";F("skre-icon").value=d.icon||"";F("skre-category").value=d.category||"";F("skre-desc").value=d.description||"";F("skre-start").value=recDateValue(d.starts_at);F("skre-end").value=recDateValue(d.ends_at);F("skre-sort").value=it?it.sort:0;
  F("skre-save").onclick=async()=>{F("skre-err").textContent="";const data={provider:F("skre-provider").value,skill_slug:F("skre-slug").value.trim(),placement:"skills.recommended",title:F("skre-title").value.trim(),icon:F("skre-icon").value.trim(),category:F("skre-category").value.trim(),description:F("skre-desc").value.trim(),starts_at:recDateEpoch(F("skre-start").value),ends_at:recDateEpoch(F("skre-end").value)};if(!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(data.skill_slug)){F("skre-err").textContent="slug 仅允许字母、数字与 . _ -";return;}if(data.provider==="skillhub"&&(!data.title||!data.description)){F("skre-err").textContent="SkillHub 推荐的标题和简介必填";return;}if(data.starts_at&&data.ends_at&&data.ends_at<=data.starts_at){F("skre-err").textContent="结束时间必须晚于生效时间";return;}try{if(it)await api("PATCH","/catalog/item/"+it.id,{data,sort:Number(F("skre-sort").value)||0});else await api("POST","/catalog",{category:"SKILL_RECOMMENDATIONS",data,sort:Number(F("skre-sort").value)||0});expClose(ov);skillsRecommendations(body);}catch(e){F("skre-err").textContent=e.message;}};
}

// 推荐位预览：引用 AgentMate 定义或 SkillHub 编辑元数据，不访问第三方商店。
async function skillsGallery(body){
  body.innerHTML = `<div class="sg-sectitle" style="margin:6px 0 12px">当前生效的推荐技能</div><div id="sg-reco" class="muted">加载中…</div>`;
  try{
    const [skillRes,recRes]=await Promise.all([api("GET","/catalog/APP_SKILLS"),api("GET","/catalog/SKILL_RECOMMENDATIONS")]);
    const skillMap=Object.fromEntries((skillRes.items||[]).map(it=>[it.data&&it.data.slug,it.data]));
    const list=(recRes.items||[]).map(it=>{const d=it.data||{},base=d.provider==="agentmate"?skillMap[d.skill_slug]||{}:{};return {slug:d.skill_slug,name:d.title||base.name||d.skill_slug,icon:d.icon||base.icon||"🧩",description:d.description||base.description||"",provider:d.provider,category:d.category||base.category||"其他",active:recActive(d)}}).filter(d=>d.slug&&d.active);
    const el=document.getElementById("sg-reco");
    el.className="";
    el.innerHTML=list.length?`<div class="sg-grid sg-g4">${list.map(d=>`<div class="sg-scard"><span class="sg-sic">${esc(d.icon||"🧩")}</span><div style="flex:1;min-width:0"><div class="sg-sn">${esc(d.name||d.slug)} <span class="pill">${esc(d.provider||"")}</span></div><div class="sg-sd">${esc(d.description||"")}</div></div></div>`).join("")}</div>`:'<div class="sg-blank">当前没有生效的推荐位；App 会继续使用本机 AgentMate 技能定义作为离线兜底</div>';
  }catch(e){ document.getElementById("sg-reco").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

// 高级 JSON（保留裸目录项编辑，供特殊类别 / 兜底）
async function rawCat(body){
  body.innerHTML = `<div class="card"><h3>新增目录项（裸 JSON）</h3>
      <div class="field"><label>分类 category（如 AUTO / PROJ_TPL / INSP）</label><input id="c-cat" placeholder="AUTO"></div>
      <div class="field"><label>data（JSON：数组或对象）</label><textarea id="c-data" placeholder='["🆕","名称",...]'></textarea></div>
      <div class="row"><input id="c-sort" type="number" value="0" style="width:90px"><span class="muted" style="font-size:12px">排序</span><div class="grow"></div><button id="c-add">新增</button></div>
      <div class="err" id="c-err"></div></div>
    <div id="c-list" class="muted">加载中…</div>`;
  document.getElementById("c-add").onclick = async ()=>{
    document.getElementById("c-err").textContent="";
    let data; try{ data = JSON.parse(document.getElementById("c-data").value); }catch(e){ document.getElementById("c-err").textContent="data 不是合法 JSON"; return; }
    try{ await api("POST","/catalog",{category:document.getElementById("c-cat").value.trim(), data, sort:Number(document.getElementById("c-sort").value)||0}); rawCat(body); }
    catch(e){ document.getElementById("c-err").textContent=e.message; }
  };
  try{ const {items} = await api("GET","/catalog?all=true");
    document.getElementById("c-list").innerHTML = items.length? items.map(it=>`<div class="list-item"><div style="flex:1;min-width:0"><div class="t">${esc(it.category)} <span class="pill">sort ${it.sort}</span>${it.enabled?"":' <span class="pill">停用</span>'}</div><div class="d" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(it.data))}</div></div><button class="danger" data-del="${it.id}">删除</button></div>`).join("") : '<div class="muted">Server 目录为空（客户端将回落本地 builtin 兜底）</div>';
    body.querySelectorAll("[data-del]").forEach(b=> b.onclick=async()=>{ try{ await api("DELETE","/catalog/item/"+b.dataset.del); rawCat(body);}catch(e){document.getElementById("c-err").textContent=e.message;} });
  }catch(e){ document.getElementById("c-list").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
